  document.getElementById('vm-title').textContent = 'Совет директоров';
  document.getElementById('vm-breadcrumbs').innerHTML = '';
  const displayName = d.displayName || d.name.replace(/\n/g, ' ');
  const avaColor = avatarColor(displayName);
  const ini = displayName.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  const avaHtml = d.photo
    ? `<img src="${d.photo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
    : `<span class="vm-hero-ini">${ini}</span>`;
  let html = `<div class="vm-hero">
    <div class="vm-hero-ava" style="background:${avaColor}">${avaHtml}</div>
    <div class="vm-hero-info">
      <div class="vm-hero-name">${escHtml(displayName)}</div>
      <div class="vm-hero-role">${escHtml(d.role || '')}</div>
    </div>
  </div>`;
  const hasContact = d.phone || d.email || d.office;
  html += `<div class="vm-section"><div class="vm-section-title">Контакты</div>`;
  if (hasContact) {
    html += `<div class="vm-contacts">`;
    if (d.phone) html += `<div class="vm-contact-row"><div class="vm-contact-label">${SVG_PHONE} Телефон</div><div class="vm-contact-val">${escHtml(d.phone)}</div><button class="vm-contact-copy" data-copy="${escHtml(d.phone)}" title="Копировать">${SVG_COPY}</button></div>`;
    if (d.email) html += `<div class="vm-contact-row"><div class="vm-contact-label">${SVG_EMAIL} E-mail</div><div class="vm-contact-val">${escHtml(d.email)}</div><button class="vm-contact-copy" data-copy="${escHtml(d.email)}" title="Копировать">${SVG_COPY}</button></div>`;
    if (d.office) html += `<div class="vm-contact-row"><div class="vm-contact-label">${SVG_OFFICE} Кабинет</div><div class="vm-contact-val">${escHtml(d.office)}</div><button class="vm-contact-copy" data-copy="${escHtml(d.office)}" title="Копировать">${SVG_COPY}</button></div>`;
    html += `</div>`;
  } else {
    html += `<div class="vm-contact-empty">Контакты не указаны</div>`;
  }
  html += `</div>`;
  document.getElementById('vm-inner').innerHTML = html;
  document.querySelectorAll('.vm-contact-copy').forEach(btn => {
    btn.addEventListener('click', () => { navigator.clipboard?.writeText(btn.dataset.copy); });
  });
  document.getElementById('v2-modal').classList.add('open');
  document.getElementById('vm-inner').parentElement.scrollTop = 0;
}

// icons: true — кнопки-иконки 36px (экран дерева), название и описание — в тултипе.
// list — свой список отделов у блока (иначе общий бэк-офис); icon у пункта — путь к svg
function renderBoStrip(containerId, icons, list) {
  const el = document.getElementById(containerId);
  el.innerHTML =
    (list || ORG_DATA.backoffice).map(b =>
      `<div class="bo-strip-item${icons ? ' bo-strip-item--icon' : ''}" ${icons ? `role="button" aria-label="${b.name}"` : ''}
        onmouseenter="showTt(event,'${b.name}','${b.desc}','')" onmouseleave="hideTt()" onmousemove="moveTt(event)">${
          icons ? (b.icon ? `<img src="${b.icon}" width="20" height="20" alt="">` : BO_ICONS[b.id]) : b.name}</div>`
    ).join('');
  if (icons) setupHScroll(el);
}

// Горизонтальная лента без полосы прокрутки: не помещается — на краях стрелки и затухание.
// Листать можно стрелками, тачпадом и колесом с Shift
function setupHScroll(el) {
  let wrap = el.parentElement;
  if (!wrap.classList.contains('hscroll')) {
    wrap = document.createElement('div');
    wrap.className = 'hscroll';
    el.parentElement.insertBefore(wrap, el);
    wrap.appendChild(el);
    // кнопки — .btn-icon размера XS (как «назад» у названия блока)
    wrap.insertAdjacentHTML('beforeend',
      `<button type="button" class="btn-icon btn-icon--xs hscroll__btn hscroll__btn--prev" aria-label="Прокрутить назад"><img src="Icons/header/arrow-left.svg" alt=""></button>
       <button type="button" class="btn-icon btn-icon--xs hscroll__btn hscroll__btn--next" aria-label="Прокрутить вперёд"><img class="btn-icon__flip" src="Icons/header/arrow-left.svg" alt=""></button>`);
    const step = () => Math.max(120, el.clientWidth * 0.6);
    wrap.querySelector('.hscroll__btn--prev').onclick = () => el.scrollBy({ left: -step(), behavior: 'smooth' });
    wrap.querySelector('.hscroll__btn--next').onclick = () => el.scrollBy({ left: step(), behavior: 'smooth' });
    el.addEventListener('scroll', () => syncHScroll(wrap), { passive: true });
    new ResizeObserver(() => syncHScroll(wrap)).observe(el);
  }
  el.scrollLeft = 0;
  syncHScroll(wrap);
}
function syncHScroll(wrap) {
  const el = wrap.querySelector('.bo-strip-items');
  const max = el.scrollWidth - el.clientWidth;
  wrap.classList.toggle('can-prev', el.scrollLeft > 1);
  wrap.classList.toggle('can-next', el.scrollLeft < max - 1);
}

/* ====================================================================
   TREE VIEW
==================================================================== */
const NW  = 148;   // person card width
const NH  = 148;   // person card height
const NHH = 177;   // heads group box height (24px padding×2 + card content)
const AW  = 108;   // assistant card width
const AG  =  20;   // gap between person card and assistant card
const DW  = 148;
const DH  = 148;
const HG  =  72;
const HGH =  28;   // gap between head cards (compact box, separate from HG)
const VG1 =  80;   // heads → persons gap
const VG2 =  80;   // between every level
const EW  = 140;   // employee canvas card width (expanded mode)
const EH  =  56;   // employee canvas card height
const EGH =  12;   // horizontal gap between employee cards in a row
const DHE = 111;   // division card height in expanded mode (DH * 0.75)
const DWE = 185;   // division card width in expanded mode (DW * 1.25)

function divCardW(d) {
  if (d.children && d.children.length > 0) {
    const n = d.children.length;
    return Math.max(DW, n * DW + (n - 1) * HG);
  }
  return DW;
}

function buildSearchIndex(data) {
  const expanded = !!data.expanded;
  SEARCH_INDEX = [];
  (data.heads || []).forEach(h => {
    SEARCH_INDEX.push({ name: h.name, role: (h.role || '').replace(/\n/g,' '), key: 'person-' + h.id, nodeId: h.id, isHead: true, context: null, path: null });
  });
  (data.persons || []).forEach(p => {
    const l2 = { level: 2, name: p.name, role: (p.role || '').replace(/\n/g,' ') };
    SEARCH_INDEX.push({ name: p.name, role: (p.role || '').replace(/\n/g,' '), key: 'person-' + p.id, nodeId: p.id, context: null, path: null });
    if (p.assistant) {
      SEARCH_INDEX.push({ name: p.assistant.name, role: p.assistant.role || '', key: 'person-ast-' + p.id, nodeId: p.id, context: null, path: [l2] });
    }
    (p.divisions || []).forEach(d => {
      if (d.type === 'division-link') return;
      const mgrName = typeof d.manager === 'string' ? d.manager : (d.manager?.name || '');
      const dName = d.name.replace(/\n/g,' ');
      const l3 = { level: 3, name: dName, manager: mgrName, id: d.id };
      if (mgrName) SEARCH_INDEX.push({ name: mgrName, role: 'Руководитель', key: 'mgr-' + d.id, nodeId: d.id, context: dName, path: [l2, l3] });
      if (d.children && d.children.length) {
        d.children.forEach(child => {
          const childMgr = typeof child.manager === 'string' ? child.manager : (child.manager?.name || '');
          const cName = child.name.replace(/\n/g,' ');
          const l4 = { level: 4, name: cName, manager: childMgr, id: child.id };
          if (childMgr) SEARCH_INDEX.push({ name: childMgr, role: 'Руководитель', key: 'mgr-' + child.id, nodeId: child.id, context: cName, path: [l2, l3, l4] });
          (child.employees || []).forEach((e, i) => {
            const empKey = 'emp-' + child.id + '-' + i;
            SEARCH_INDEX.push({ name: e.name, role: e.role || '', key: empKey, nodeId: expanded ? empKey : child.id, context: cName, path: [l2, l3, l4] });
          });
        });
      } else {
        (d.employees || []).forEach((e, i) => {
          const empKey = 'emp-' + d.id + '-' + i;
          SEARCH_INDEX.push({ name: e.name, role: e.role || '', key: empKey, nodeId: expanded ? empKey : d.id, context: dName, path: [l2, l3] });
        });
      }
    });
  });
}

function personSlotInfo(person) {
  const divs = person.divisions || [];
  const divsW = divs.length ? divs.reduce((s, d) => s + divCardW(d), 0) + (divs.length - 1) * HG : 0;
  const hasAst = !!person.assistant;
  // How far the combined block extends left/right of the person-card centre
  const leftExt  = Math.max(NW / 2, divsW / 2);
  const rightExt = Math.max(hasAst ? NW / 2 + AG + AW : NW / 2, divsW / 2);
  return { sw: leftExt + rightExt, personCxOffset: leftExt };
}

/* Ширина слота деления в expanded-режиме.
   Сотрудники складываются вертикально, не влияют на горизонтальную ширину. */
function divCardWExp(d) {
  if (d.children && d.children.length > 0) {
    const n = d.children.length;
    return Math.max(DWE, d.children.reduce((s, c) => s + divCardWExp(c), 0) + (n - 1) * HG);
  }
  return DWE;
}

function personSlotInfoExp(person) {
  const divs = person.divisions || [];
  const divsW = divs.length ? divs.reduce((s, d) => s + divCardWExp(d), 0) + (divs.length - 1) * HG : 0;
  const hasAst = !!person.assistant;
  const leftExt  = Math.max(NW / 2, divsW / 2);
  const rightExt = Math.max(hasAst ? NW / 2 + AG + AW : NW / 2, divsW / 2);
  return { sw: leftExt + rightExt, personCxOffset: leftExt };
}

function openTree(companyId, blockId, blockName) {
  if (blockId === 'custom') {   // «Структура» — свой экран; файл custom-structure.js подключён после основного скрипта
    if (typeof openCustomStructure === 'function') return openCustomStructure();
    return window.addEventListener('DOMContentLoaded', () => openCustomStructure(), { once: true });
  }
  document.getElementById('view-tree').classList.remove('is-custom');
  const treeData = ORG_DATA.trees?.[blockId];
  if (!treeData) { alert('Данные дерева пока не загружены'); return; }
  goTo('tree', companyId, blockId, blockName);
  document.getElementById('tv-title').textContent = blockName;

  // Описание блока
  const desc = treeData.description || '';
  const descEl = document.getElementById('tv-desc');
  const moreBtn = document.getElementById('btn-block-more');
  if (desc) {
    descEl.textContent = desc;
    descEl.style.display = '';
    moreBtn.style.display = '';
  } else {
    descEl.style.display = 'none';
    moreBtn.style.display = 'none';
  }

  // Кнопка юридических лиц
  const coData = ORG_DATA[companyId];
  const leCount = (coData?.legalEntities || []).length;
  const legalBtn = document.getElementById('btn-legal-open');
  if (leCount) {
    legalBtn.textContent = `Список юридических лиц (${leCount})`;
    legalBtn.style.display = '';
    legalBtn.onclick = () => openLegalModal(companyId, blockId);
  } else {
    legalBtn.style.display = 'none';
  }

  // Печать — пока только для деревьев v2
  document.getElementById('btn-print-open').style.display = treeData.version === 2 ? '' : 'none';
  document.getElementById('btn-fold-all').hidden = treeData.version !== 2;

  renderBoStrip('bo-strip-tree', true, treeData.backoffice);
  canvas = { scale: 1, x: 0, y: 0 };
  V2_FOLD = new Map();
  if (treeData.version === 2) buildTreeV2(treeData);
  else if (treeData.expanded) buildTreeExpanded(treeData);
  else buildTree(treeData);
  centerView(true);
  setupCanvas();
}

function buildTree(data) {
  DEPT_REGISTRY = {};
  buildSearchIndex(data);
  const inner = document.getElementById('canvas-inner');
  const svg   = document.getElementById('tree-svg');
  inner.innerHTML = '';
  inner.appendChild(svg);
  svg.innerHTML   = '';

  const heads   = data.heads   || [];
  const persons = data.persons || [];

  const headsW = heads.length * NW + (heads.length - 1) * HGH;
  const personsW = persons.reduce((s, p) => s + personSlotInfo(p).sw, 0) + Math.max(0, persons.length - 1) * HG;
  const totalW = Math.max(headsW, personsW);
  const startX = 60;
  const centerX = startX + totalW / 2;

  const headsY = 40;
  const headStartX = centerX - headsW / 2;

  const headsBox = document.createElement('div');
  headsBox.className = 'tree-node';
  /* При подложке сдвигаем влево на padding (12px), чтобы блок оставался центрирован */
  headsBox.style.left = (heads.length > 1 ? headStartX - 12 : headStartX) + 'px';
  headsBox.style.top  = headsY + 'px';
  const headsInner = document.createElement('div');
  headsInner.className = 'group-heads-box' + (heads.length > 1 ? ' group-heads-box--plate' : '');
  heads.forEach(h => {
    DEPT_REGISTRY['person-' + h.id] = h;
    const card = document.createElement('div');
    card.className = 'card-head';
    card.dataset.nodeId = h.id;
    card.innerHTML = `
      <div class="card-head-avatar">${h.photo ? `<img src="${h.photo}">` : initials(h.name)}</div>
      <div class="card-head-role">${h.role.replace(/\n/g,'<br>')}</div>
      <div class="card-head-name">${h.name}</div>`;
    card.onclick = () => openPersonPanel('person-' + h.id);
    headsInner.appendChild(card);
  });
  headsBox.appendChild(headsInner);
  inner.appendChild(headsBox);

  if (!persons.length) { applyTransform(); return; }

  const measuredNHH = headsBox.offsetHeight || NHH;
  const personsY = headsY + measuredNHH + VG1;
  const divsY3 = personsY + NH + VG2;          // level 3: direct divisions
  const divsY4 = divsY3  + DH + VG2;           // level 4: skipLevel divisions
  let px = centerX - personsW / 2;
  const personPositions = [];

  persons.forEach(p => {
    const { sw, personCxOffset } = personSlotInfo(p);
    const cx = px + personCxOffset;
    personPositions.push({ person: p, cx, x: cx - NW / 2, y: personsY, sw });
    px += sw + HG;
  });

  const headsBottomY = headsY + measuredNHH;
  const headsBranchY = personsY - Math.round(VG1 / 2);
  personPositions.forEach(pp => addConnector(svg, centerX, headsBottomY, pp.cx, personsY, headsBranchY));

  personPositions.forEach(pp => {
    const { person: p, x, y, cx } = pp;

    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';
    wrapper.dataset.nodeId = p.id;
    wrapper.style.left = x + 'px';
    wrapper.style.top  = y + 'px';

    DEPT_REGISTRY['person-' + p.id] = p;
    const pCard = document.createElement('div');
    pCard.className = 'card-person';
    pCard.style.cursor = 'pointer';
    pCard.innerHTML = `
      <div class="card-person-avatar">${p.photo ? `<img src="${p.photo}">` : initials(p.name)}</div>
      <div class="card-person-role">${p.role.replace(/\n/g,'<br>')}</div>
      <div class="card-person-name">${p.name}</div>`;
    pCard.onclick = () => openPersonPanel('person-' + p.id);
    wrapper.appendChild(pCard);

    if (p.assistant) {
      const astKey = 'person-ast-' + p.id;
      DEPT_REGISTRY[astKey] = { ...p.assistant };
      const ast = document.createElement('div');
      ast.className = 'card-assistant';
      ast.style.left = (NW + AG) + 'px';
      ast.style.top  = Math.round(NH / 2 - 48) + 'px';
      ast.innerHTML  = `
        <div class="card-assistant-avatar">${p.assistant.photo ? `<img src="${p.assistant.photo}">` : initials(p.assistant.name)}</div>
        <div class="card-assistant-role">${p.assistant.role}</div>
        <div class="card-assistant-name">${p.assistant.name}</div>`;
      ast.onclick = () => openPersonPanel(astKey);
      wrapper.appendChild(ast);
      addLine(svg, x + NW, y + NH / 2, x + NW + AG, y + NH / 2);
    }
    inner.appendChild(wrapper);

    const divs = p.divisions || [];
    if (!divs.length) return;

    const divsY  = p.skipLevel ? divsY4 : divsY3;
    const divsW  = divs.reduce((s, d) => s + divCardW(d), 0) + (divs.length - 1) * HG;
    let dx = cx - divsW / 2;

    const personBottomY = y + NH;
    const divsBranchY = divsY - Math.round(VG2 / 2);

    divs.forEach(d => {
      const dW     = divCardW(d);
      const divCx  = dx + dW / 2;
      const cardLeft = dx + Math.round((dW - DW) / 2);

      const dNode = document.createElement('div');
      dNode.className = 'tree-node';
      dNode.dataset.nodeId = d.id;
      dNode.style.left = cardLeft + 'px';
      dNode.style.top  = divsY + 'px';

      const dCard = document.createElement('div');
      if (d.type === 'division-link') {
        dCard.className = 'card-div-link';
        dCard.innerHTML = `${d.name.replace(/\n/g,'<br>')} <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6h8M6 2l4 4-4 4"/></svg>`;
        dCard.onclick = () => alert(`Переход: ${d.name.replace(/\n/g,' ')}\n(подключите ссылку в ORG_DATA)`);
      } else {
        dCard.className = 'card-div';
        dCard.innerHTML = buildDivCardHTML(d);
        if (d.employees || (d.children && d.children.length)) {
          dCard.style.cursor = 'pointer';
          dCard.onclick = e => {
            if (e.target.closest('.cdiv-manager-chip') || e.target.closest('.cdiv-emp-chip')) return;
            if (d.children && d.children.length) openDivisionPanel(d.id);
            else openTeamPanel(d.id);
          };
        }
      }
      if (d.tooltip) {
        dCard.addEventListener('mouseenter', e => showTt(e, d.name.replace(/\n/g,' '), d.tooltip.desc, d.tooltip.assistant));
        dCard.addEventListener('mousemove',  e => moveTt(e));
        dCard.addEventListener('mouseleave', hideTt);
      }
      dNode.appendChild(dCard);
      inner.appendChild(dNode);

      addConnector(svg, cx, personBottomY, divCx, divsY, divsBranchY);

      if (d.children && d.children.length) {
        const childrenY    = divsY + DH + VG2;
        const childrenW    = d.children.length * DW + (d.children.length - 1) * HG;
        let   childX       = divCx - childrenW / 2;
        const divBottomY   = divsY + DH;
        const childBranchY = childrenY - Math.round(VG2 / 2);

        d.children.forEach(child => {
          const childCx = childX + DW / 2;
          const cNode = document.createElement('div');
          cNode.className = 'tree-node';
          cNode.dataset.nodeId = child.id;
          cNode.style.left = childX + 'px';
          cNode.style.top  = childrenY + 'px';

          const cCard = document.createElement('div');
          cCard.className = 'card-div';
          cCard.innerHTML = buildDivCardHTML(child);
          if (child.employees || (child.children && child.children.length)) {
            cCard.style.cursor = 'pointer';
            cCard.onclick = e => {
              if (e.target.closest('.cdiv-manager-chip') || e.target.closest('.cdiv-emp-chip')) return;
              if (child.children && child.children.length) openDivisionPanel(child.id);
              else openTeamPanel(child.id);
            };
          }
          cNode.appendChild(cCard);
          inner.appendChild(cNode);

          addConnector(svg, divCx, divBottomY, childCx, childrenY, childBranchY);
          childX += DW + HG;
        });
      }

      dx += dW + HG;
    });
  });

  let maxX = 0, maxY = 0;
  inner.querySelectorAll('.tree-node').forEach(n => {
    maxX = Math.max(maxX, parseInt(n.style.left) + 300);
    maxY = Math.max(maxY, parseInt(n.style.top)  + 200);
  });
  svg.setAttribute('width',  maxX);
  svg.setAttribute('height', maxY);
  inner.style.width  = maxX + 'px';
  inner.style.height = maxY + 'px';

  applyTransform();
}

/* ====================================================================
   EXPANDED TREE (Управление недвижимостью): сотрудники — карточки на канвасе
==================================================================== */
function buildTreeExpanded(data) {
  DEPT_REGISTRY = {};
  buildSearchIndex(data);
  const inner = document.getElementById('canvas-inner');
  const svg   = document.getElementById('tree-svg');
  inner.innerHTML = '';
  inner.appendChild(svg);
  svg.innerHTML   = '';

  const heads   = data.heads   || [];
  const persons = data.persons || [];

  const headsW   = heads.length * NW + (heads.length - 1) * HGH;
  const personsW = persons.reduce((s, p) => s + personSlotInfoExp(p).sw, 0) + Math.max(0, persons.length - 1) * HG;
  const totalW   = Math.max(headsW, personsW);
  const startX   = 60;
  const centerX  = startX + totalW / 2;

  const headsY      = 40;
  const headStartX  = centerX - headsW / 2;

  const headsBox   = document.createElement('div');
  headsBox.className = 'tree-node';
  headsBox.style.left = (heads.length > 1 ? headStartX - 12 : headStartX) + 'px';
  headsBox.style.top  = headsY + 'px';
  const headsInner = document.createElement('div');
  headsInner.className = 'group-heads-box' + (heads.length > 1 ? ' group-heads-box--plate' : '');
  heads.forEach(h => {
    DEPT_REGISTRY['person-' + h.id] = h;
    const card = document.createElement('div');
    card.className = 'card-head';
    card.dataset.nodeId = h.id;
    card.innerHTML = `
      <div class="card-head-avatar">${h.photo ? `<img src="${h.photo}">` : initials(h.name)}</div>
      <div class="card-head-role">${h.role.replace(/\n/g,'<br>')}</div>
      <div class="card-head-name">${h.name}</div>`;
    card.onclick = () => openPersonPanel('person-' + h.id);
    headsInner.appendChild(card);
  });
  headsBox.appendChild(headsInner);
  inner.appendChild(headsBox);

  if (!persons.length) { applyTransform(); return; }

  const measuredNHH = headsBox.offsetHeight || NHH;
  const personsY    = headsY + measuredNHH + VG1;
  const divsY3      = personsY + NH + VG2;
  let   px          = centerX - personsW / 2;
  const personPositions = [];

  persons.forEach(p => {
    const { sw, personCxOffset } = personSlotInfoExp(p);
    const cx = px + personCxOffset;
    personPositions.push({ person: p, cx, x: cx - NW / 2, y: personsY, sw });
    px += sw + HG;
  });

  const headsBottomY = headsY + measuredNHH;
  const headsBranchY = personsY - Math.round(VG1 / 2);
  personPositions.forEach(pp => addConnector(svg, centerX, headsBottomY, pp.cx, personsY, headsBranchY));

  personPositions.forEach(pp => {
    const { person: p, x, y, cx } = pp;

    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';
    wrapper.dataset.nodeId = p.id;
    wrapper.style.left = x + 'px';
    wrapper.style.top  = y + 'px';

    DEPT_REGISTRY['person-' + p.id] = p;
    const pCard = document.createElement('div');
    pCard.className = 'card-person';
    pCard.style.cursor = 'pointer';
    pCard.innerHTML = `
      <div class="card-person-avatar">${p.photo ? `<img src="${p.photo}">` : initials(p.name)}</div>
      <div class="card-person-role">${p.role.replace(/\n/g,'<br>')}</div>
      <div class="card-person-name">${p.name}</div>`;
    pCard.onclick = () => openPersonPanel('person-' + p.id);
    wrapper.appendChild(pCard);
    inner.appendChild(wrapper);

    const divs = p.divisions || [];
    if (!divs.length) return;

    const divsW      = divs.reduce((s, d) => s + divCardWExp(d), 0) + (divs.length - 1) * HG;
    let   dx         = cx - divsW / 2;
    const personBotY = y + NH;
    const divBranchY = divsY3 - Math.round(VG2 / 2);

    divs.forEach(d => {
      const dW      = divCardWExp(d);
      const divCx   = dx + dW / 2;
      const cardL   = dx + Math.round((dW - DWE) / 2);

      const dNode = document.createElement('div');
      dNode.className = 'tree-node';
      dNode.dataset.nodeId = d.id;
      dNode.style.left = cardL + 'px';
      dNode.style.top  = divsY3 + 'px';

      const dCard = document.createElement('div');
      dCard.className = 'card-div card-div--exp';
      dCard.innerHTML = buildDivCardHTMLExp(d);
      dNode.appendChild(dCard);
      inner.appendChild(dNode);

      addConnector(svg, cx, personBotY, divCx, divsY3, divBranchY);

      if (d.children && d.children.length) {
        const childrenY  = divsY3 + DHE + VG2;
        const childrenW  = d.children.reduce((s, c) => s + divCardWExp(c), 0) + (d.children.length - 1) * HG;
        let   childX     = divCx - childrenW / 2;
        const divBotY    = divsY3 + DHE;
        const cBranchY   = childrenY - Math.round(VG2 / 2);

        d.children.forEach(child => {
          const cW      = divCardWExp(child);
          const childCx = childX + cW / 2;
          const cCardL  = childX + Math.round((cW - DWE) / 2);

          const cNode = document.createElement('div');
          cNode.className = 'tree-node';
          cNode.dataset.nodeId = child.id;
          cNode.style.left = cCardL + 'px';
          cNode.style.top  = childrenY + 'px';

          const cCard = document.createElement('div');
          cCard.className = 'card-div card-div--exp';
          cCard.innerHTML = buildDivCardHTMLExp(child);
          cNode.appendChild(cCard);
          inner.appendChild(cNode);

          addConnector(svg, divCx, divBotY, childCx, childrenY, cBranchY);

          if (child.employees && child.employees.length) {
            renderEmpRow(inner, svg, child, childCx, childrenY + DHE);
          }
          childX += cW + HG;
        });
      } else if (d.employees && d.employees.length) {
        renderEmpRow(inner, svg, d, divCx, divsY3 + DHE);
      }

      dx += dW + HG;
    });
  });

  let maxX = 0, maxY = 0;
  inner.querySelectorAll('.tree-node').forEach(n => {
    maxX = Math.max(maxX, parseInt(n.style.left) + 300);
    maxY = Math.max(maxY, parseInt(n.style.top)  + 200);
  });
  svg.setAttribute('width',  maxX);
  svg.setAttribute('height', maxY);
  inner.style.width  = maxX + 'px';
  inner.style.height = maxY + 'px';

  applyTransform();
}

/* ====================================================================
   TREE V2 — новый дизайн карточек
==================================================================== */
function makeV2Photo(name, photo, fullName) {
  const el = document.createElement('div');
  el.className = 'card-v2__photo';
  if (photo) {
    el.innerHTML = `<img src="${photo}" alt="">`;
  } else {
    el.style.background = avatarColor(fullName || name);
    const ini = document.createElement('span');
    ini.className = 'card-v2__photo-initials';
    ini.textContent = initials(name);
    el.appendChild(ini);
  }
  return el;
}

// Аватарка карточки + отметка зама: плашка «Зам.» по низу аватарки. Пока зам определяется по должности
// («Заместитель…») и флагу deputy (замы из данных отдела); метод уточнят разработчики/заказчик
function v2IsDeputy(person) { return !!(person && (person.deputy || /^заместитель/i.test((person.role || '').trim()))); }
function v2PutAvatar(wrap, person) {
  if (person.deps && person.deps.length) v2PutDepsStack(wrap, person.deps);
  const ph = makeV2Photo(person.name, person.photo, person.fullName);
  if (!v2IsDeputy(person)) { wrap.appendChild(ph); return; }
  const box = document.createElement('div');
  box.className = 'v2-ava';
  box.append(ph);
  box.insertAdjacentHTML('beforeend', '<span class="v2-zam" title="Заместитель">Зам.</span>');
  wrap.appendChild(box);
}

// Вариант на сравнение: замы — стопкой аватарок у правого края карточки руководителя (deps у человека).
// Имена — в подсказке при наведении
function v2PutDepsStack(wrap, deps) {
  const st = document.createElement('div');
  st.className = 'v2-deps';
  st.title = 'Заместители: ' + deps.map(d => d.fullName || d.name).join(', ');
  deps.forEach((d, i) => {   // левый — сверху, следующие подкладываются под него
    const ph = makeV2Photo(d.name, d.photo, d.fullName || d.name);
    ph.style.zIndex = deps.length - i;
    st.appendChild(ph);
  });
  wrap.appendChild(st);
}

function makeCardV2El(name, role, photo, deptName, deptIsLink, onDeptClick, fullName) {
  const card = document.createElement('div');
  card.className = 'card-v2';
  const body = document.createElement('div');
  body.className = 'card-v2__body';

    // Шапка: Wrap + Surface
    const header = document.createElement('div');
    header.className = 'card-v2-mh__header';

    wrap.className = 'card-v2-mh__wrap card-v2__body';

    header.appendChild(wrap);

    // Тело: имя + роль

    body.className = 'card-v2-mh__body';

    const textEl = document.createElement('div');
    textEl.className = 'card-v2-mh__text';
    textEl.innerHTML = h.vacant
      ? (h.vacant === 'empty' || h.vacant === 'circle' ? '' : `<div class="card-v2__name card-v2__name--vacant">${h.vacant === 'dash' ? '—' : 'Без руководителя'}</div>`)
      : `<div class="card-v2__name">${h.name}</div><div class="card-v2__role">${(h.role || '').replace(/\n/g, '<br>')}</div>`;
    body.appendChild(textEl);

/* ---- Сворачивание веток ----
   Руководители блока и карточки 2-го уровня видны всегда. Ниже ветка карточки
   по умолчанию свёрнута, если у неё больше V2_FOLD_LIMIT дочерних карточек.
   Кнопка внизу карточки сворачивает/разворачивает; выбор помнится до смены блока. */
const V2_FOLD_LIMIT = 3;
let V2_FOLD = new Map();   // ключ карточки → true (свёрнута) / false (развёрнута)

function v2IsFolded(key, count) {
  return V2_FOLD.has(key) ? V2_FOLD.get(key) : count > V2_FOLD_LIMIT;
}

// Копия данных без свёрнутых веток; у карточек с ветками — _fold { key, count, folded }
// Замы руководителей (deputies в данных отдела) — карточками в дереве: первыми слева в ряду
// под руководителем. Кто уже есть на дереве карточкой, повторно не выводится
function v2AddDeputies(persons) {
  const onTree = new Set();
  const mark = x => { if (x) { onTree.add(x.id); onTree.add(x.fullName || x.name); } };
  (function walk(list) {
    (list || []).forEach(x => {
      mark(x); walk(x.children); walk(x.nested);
      if (x.childBlock) { mark(x.childBlock.head); x.childBlock.depts.forEach(d => { mark(d.person); walk(d.children); }); }
    });
  })(persons);
  const deps = owner => ((owner.dept && owner.dept.modal && owner.dept.modal.deputies) || [])
    .filter(d => d && !onTree.has(d.id) && !onTree.has(d.fullName || d.name))
    .map(d => ({ id: d.id, name: d.name, fullName: d.fullName, role: d.role, photo: d.photo || null, deputy: true }));
  return persons.map(p => {
    if (p.nested) return { ...p, nested: p.nested.map(n => { const d = deps(n); return d.length ? { ...n, children: [...d, ...(n.children || [])] } : n; }) };
    const d = deps(p);
    return d.length ? { ...p, children: [...d, ...(p.children || [])] } : p;
  });
}

function v2ApplyFold(data) {
  const persons = v2AddDeputies(data.persons || []).map(p => {
    const q = { ...p };
    // Внутренние карточки наборной: больше V2_FOLD_LIMIT — видны первые, остальные по боковой кнопке
    if (p.nested && p.nested.length > V2_FOLD_LIMIT) {
      const key = 'inner:' + p.id, hidden = p.nested.length - V2_FOLD_LIMIT;
      q._innerFold = { key, count: hidden, folded: v2IsFolded(key, p.nested.length) };
      if (q._innerFold.folded) q.nested = p.nested.slice(0, V2_FOLD_LIMIT);
    }
    // У наборной карточки ветки внутренних карточек сворачиваются каждая своей кнопкой;
    // общая кнопка — только для подразделений, висящих прямо под всей карточкой
    if (q.nested) q.nested = q.nested.map(n => {
      const cnt = (n.children || []).length || (n.childBlock ? 1 : 0);
      if (!cnt) return n;
      const fold = { key: 'n:' + n.id, count: cnt };
      fold.folded = v2IsFolded(fold.key, cnt);
      return fold.folded ? { ...n, children: [], childBlock: undefined, _fold: fold } : { ...n, _fold: fold };
    });
    const count = (p.children || []).length;
    if (count) q._fold = { key: p.id, count, folded: v2IsFolded(p.id, count), corner: !!q.nested };
    const nestedSrc = q.nested;
    if (q._fold && q._fold.folded) { q.children = []; }
    else q.children = (p.children || []).map(c => {
      if (!c.childBlock || !c.childBlock.depts.length) return c;
      const fold = { key: c.id, count: c.childBlock.depts.length };
      fold.folded = v2IsFolded(fold.key, fold.count);
      return fold.folded ? { ...c, childBlock: undefined, _fold: fold } : { ...c, _fold: fold };
    });
    if (nestedSrc) q.nested = nestedSrc.map(n => {
      if (!n.childBlock) return n;
      const cb = n.childBlock;
      const cnt = cb.depts.reduce((s, d) => s + (d.children || []).length, 0);
      if (!cnt) return n;
      const fold = { key: cb.head.id, count: cnt };
      fold.folded = v2IsFolded(fold.key, cnt);
      return { ...n, childBlock: { ...cb, _fold: fold,
        depts: fold.folded ? cb.depts.map(d => ({ ...d, children: [] })) : cb.depts } };
    });
    return q;
  });
  return { ...data, persons };
}

// Кнопка сворачивания внизу карточки: свёрнуто — «N ⌄», развёрнуто — «⌃»
const SVG_FOLD_CHEVRON = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// left — центр кнопки от левого края узла (для внутренних карточек наборной)
function v2AddFoldButton(nodeEl, fold, left) {
  if (!fold) return;
  if (!nodeEl.dataset.foldKey) nodeEl.dataset.foldKey = fold.key;
  const btn = document.createElement('button');
  btn.className = 'fold-btn' + (fold.folded ? ' fold-btn--folded' : '') + (fold.corner ? ' fold-btn--corner' : '');
  if (left != null) btn.style.left = left + 'px';
  btn.title = fold.folded ? `Показать ${fold.count} ${pluralRu(fold.count, ['подразделение', 'подразделения', 'подразделений'])}` : 'Свернуть';
  btn.innerHTML = (fold.folded ? `<span>${fold.count}</span>` : '') + SVG_FOLD_CHEVRON;
  btn.addEventListener('mousedown', e => e.stopPropagation());   // не начинать перетаскивание холста
  btn.addEventListener('click', e => { e.stopPropagation(); v2ToggleFold(fold, nodeEl.dataset.pid ? `.tree-node[data-pid="${nodeEl.dataset.pid}"]` : null); });
  nodeEl.appendChild(btn);
}

// Боковая кнопка наборной карточки: свёрнуто — «+N ›», развёрнуто — «‹»
function v2AddInnerButton(nodeEl, fold) {
  if (!fold) return;
  nodeEl.dataset.foldKey = nodeEl.dataset.foldKey || fold.key;
  nodeEl.dataset.innerKey = fold.key;
  const btn = document.createElement('button');
  btn.className = 'fold-btn fold-btn--side' + (fold.folded ? ' fold-btn--folded' : '');
  btn.title = fold.folded ? `Показать ещё ${fold.count}` : 'Свернуть';
  btn.innerHTML = (fold.folded ? `<span>+${fold.count}</span>` : '') + SVG_FOLD_CHEVRON;
  btn.addEventListener('mousedown', e => e.stopPropagation());
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const sel = `.tree-node[data-pid="${nodeEl.dataset.pid}"]`;
    const collapsing = !fold.folded;
    v2ToggleFold(fold, sel);
    // свернули широкую карточку — она сжимается влево и может уйти за край: плавно навести на неё камеру
    if (collapsing) v2PanToNode(document.querySelector(sel));
  });
  nodeEl.appendChild(btn);
}

// Плавность раскрытия (FLIP): оставшиеся карточки переезжают, новые выплывают, ушедшие тают,
// линии проявляются в конце. При «уменьшить движение» в системе — без анимации
const FOLD_ANIM = { move: 420, enter: 360, leave: 220, ease: 'cubic-bezier(0.22, 0.7, 0.2, 1)' };
function v2NodeKey(n) {
  const c = n.querySelector('[data-v2-pid]');
  return c ? c.dataset.v2Pid : null;
}

// Плавно сдвинуть камеру так, чтобы карточка была по центру полотна по горизонтали
// (по вертикали не трогаем) — в такт анимации перестройки
function v2PanToNode(nodeEl) {
  if (!nodeEl) return;
  const wrap = document.getElementById('canvas-wrapper').getBoundingClientRect();
  const cx = parseFloat(nodeEl.style.left) + nodeEl.offsetWidth / 2;
  const from = canvas.x, to = wrap.width / 2 - cx * canvas.scale;
  if (Math.abs(to - from) < 1) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { canvas.x = to; applyTransform(); return; }
  const t0 = performance.now(), dur = FOLD_ANIM.move;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    canvas.x = from + (to - from) * ease(t);
    applyTransform();
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Перестроить дерево, оставив переключённую карточку на том же месте экрана
function v2ToggleFold(fold, selector) {
  v2Rebuild(() => V2_FOLD.set(fold.key, !fold.folded), selector || `.tree-node[data-fold-key="${fold.key}"]`);
}

// Перестроить дерево после изменения сворачивания (mutate) с плавной анимацией;
// карточка по селектору sel остаётся на том же месте экрана
function v2Rebuild(mutate, sel) {
  const before = document.querySelector(sel);
  const bx = before ? parseFloat(before.style.left) : 0, by = before ? parseFloat(before.style.top) : 0;
  const snap = new Map(), lines = new Map();
  document.querySelectorAll('.tree-node').forEach(n => {
    const k = v2NodeKey(n);
    if (k) snap.set(k, { x: parseFloat(n.style.left), y: parseFloat(n.style.top), el: n });
  });
  document.querySelectorAll('#tree-svg path[data-key]').forEach(l => lines.set(l.dataset.key, JSON.parse(l.dataset.geom)));

  mutate();
  if (state.blockId === 'custom') buildCustomTree(); else buildTreeV2(V2_BLOCK_DATA);   // «Структура» — своя отрисовка

  const after = document.querySelector(sel);
  let dX = 0, dY = 0;   // сдвиг системы координат холста (якорная карточка стоит на месте)
  if (before && after) {
    dX = parseFloat(after.style.left) - bx;
    dY = parseFloat(after.style.top) - by;
    canvas.x -= dX * canvas.scale;
    canvas.y -= dY * canvas.scale;
    applyTransform();
  }
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const A = FOLD_ANIM, seen = new Set();
  document.querySelectorAll('.tree-node').forEach(n => {
    const k = v2NodeKey(n), o = k && snap.get(k);
    if (o) {
      seen.add(k);
      const tx = o.x + dX - parseFloat(n.style.left), ty = o.y + dY - parseFloat(n.style.top);
      if (Math.abs(tx) > 0.5 || Math.abs(ty) > 0.5)
        n.animate([{ transform: `translate(${tx}px, ${ty}px)` }, { transform: 'none' }], { duration: A.move, easing: A.ease });
    } else {
      n.animate([{ opacity: 0, transform: 'translateY(-16px) scale(0.96)' }, { opacity: 1, transform: 'none' }],
        { duration: A.enter, easing: A.ease, delay: 80, fill: 'backwards' });
    }
  });
  // Ушедшие карточки — призраки на старом месте, тают
  const inner = document.getElementById('canvas-inner');
  snap.forEach((o, k) => {
    if (seen.has(k)) return;
    const ghost = o.el;
    ghost.style.left = (o.x + dX) + 'px';
    ghost.style.top = (o.y + dY) + 'px';
    ghost.style.pointerEvents = 'none';
    inner.appendChild(ghost);
    ghost.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-12px) scale(0.96)' }],
      { duration: A.leave, easing: 'ease-in', fill: 'forwards' }).onfinish = () => ghost.remove();
  });
  // Линии: оставшиеся перетекают в новую форму синхронно с карточками, новые вырастают
  // из родительской карточки, ушедшие втягиваются в неё обратно
  const svg = document.getElementById('tree-svg');
  const shift = g => ({ px: g.px + dX, py: g.py + dY, cx: g.cx + dX, cy: g.cy + dY, midY: g.midY + dY });
  const seenLines = new Set();
  svg.querySelectorAll('path[data-key]').forEach(l => {
    const old = lines.get(l.dataset.key);
    if (old) {
      seenLines.add(l.dataset.key);
      const from = connectorD(shift(old)), to = l.getAttribute('d');
      if (from !== to) l.animate([{ d: `path("${from}")` }, { d: `path("${to}")` }], { duration: A.move, easing: A.ease });
    } else {
      const g = JSON.parse(l.dataset.geom);
      const from = connectorD({ px: g.px, py: g.py, cx: g.px, cy: g.py, midY: g.py });
      l.animate([{ d: `path("${from}")`, opacity: 0 }, { opacity: 1, offset: 0.25 }, { d: `path("${l.getAttribute('d')}")`, opacity: 1 }],
        { duration: A.move, easing: A.ease });
    }
  });
  lines.forEach((g, k) => {
    if (seenLines.has(k)) return;
    const ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ['stroke', 'stroke-width', 'fill', 'stroke-linecap'].forEach((a, i) =>
      ghost.setAttribute(a, ['var(--canvas-line)', '1.5', 'none', 'round'][i]));
    const sg = shift(g);
    ghost.setAttribute('d', connectorD(sg));
    svg.appendChild(ghost);
    const to = connectorD({ px: sg.px, py: sg.py, cx: sg.px, cy: sg.py, midY: sg.py });
    ghost.animate([{ d: `path("${connectorD(sg)}")`, opacity: 1 }, { opacity: 1, offset: 0.7 }, { d: `path("${to}")`, opacity: 0 }],
      { duration: A.leave + 120, easing: A.ease, fill: 'forwards' }).onfinish = () => ghost.remove();
  });
}

// Все ключи сворачивания блока — для «Развернуть все / Свернуть все»
function v2AllFoldKeys(data) {
  const keys = [];
  (data.persons || []).forEach(p => {
    if (p.nested && p.nested.length > V2_FOLD_LIMIT) keys.push('inner:' + p.id);
    if ((p.children || []).length) keys.push(p.id);
    (p.children || []).forEach(c => { if (c.childBlock && c.childBlock.depts.length) keys.push(c.id); });
    (p.nested || []).forEach(n => {
      if ((n.children || []).length || n.childBlock) keys.push('n:' + n.id);
      if (n.childBlock && n.childBlock.depts.some(d => (d.children || []).length)) keys.push(n.childBlock.head.id);
    });
  });
  return keys;
}

// Кнопка у масштаба: есть свёрнутые ветки — «Развернуть все», иначе — «Свернуть все»
function v2FoldAllClick() {
  const expand = document.getElementById('btn-fold-all').dataset.mode === 'expand';
  v2Rebuild(() => v2AllFoldKeys(V2_BLOCK_DATA).forEach(k => V2_FOLD.set(k, !expand)), '#canvas-inner .tree-node');
}
function v2SyncFoldAll() {
  const btn = document.getElementById('btn-fold-all');
  if (!btn) return;
  const inner = document.getElementById('canvas-inner');
  const anyFolded = !!inner.querySelector('.fold-btn--folded');
  btn.hidden = !inner.querySelector('.fold-btn');   // сворачивать нечего — кнопки нет
  btn.dataset.mode = anyFolded ? 'expand' : 'collapse';
  btn.title = anyFolded ? 'Развернуть все' : 'Свернуть все';
  btn.setAttribute('aria-label', btn.title);
}

// Раскрыть ветки, в которых лежит карточка человека (для поиска). true — что-то раскрыли
function v2UnfoldTo(personId) {
  const keys = [];
  const has = list => (list || []).some(x => x && (x.id === personId));
  (V2_BLOCK_DATA.persons || []).forEach(p => {
    (p.children || []).forEach(c => {
      if (c.id === personId) keys.push(p.id);
      if (c.childBlock && (c.childBlock.head.id === personId || c.childBlock.depts.some(d => d.person.id === personId)))
        keys.push(p.id, c.id);
    });
    (p.nested || []).forEach((n, ni) => {
      const deep = n.id === personId || has(n.children)
        || (n.childBlock && (n.childBlock.head.id === personId || n.childBlock.depts.some(d => d.person.id === personId || has(d.children))));
      if (deep && ni >= V2_FOLD_LIMIT) keys.push('inner:' + p.id);
      if (has(n.children)) keys.push('n:' + n.id);
      const cb = n.childBlock;
      if (!cb) return;
      if (cb.head.id === personId || cb.depts.some(d => d.person.id === personId)) keys.push('n:' + n.id);
      if (cb.depts.some(d => has(d.children))) keys.push('n:' + n.id, cb.head.id);
    });
  });
  let changed = false;
  keys.forEach(k => { if (V2_FOLD.get(k) !== false) { V2_FOLD.set(k, false); changed = true; } });
  return changed;
}

function pluralRu(n, forms) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return forms[1];
  return forms[2];
}

// Отдел-ссылка — тот, у которого есть своё дерево (treeId) или явный link
function v2IsLink(dept) { return !!(dept && typeof dept === 'object' && (dept.link || dept.treeId)); }
// Клик по отделу: ссылка с деревом — открыть дерево, иначе — модалка отдела
function v2DeptClick(dept, crumbs) {
  if (!dept || typeof dept !== 'object') return null;
  if (dept.treeId) return () => openTree(state.companyId, dept.treeId, (dept.name || '').replace(/\n/g, ' '));
  return dept.id ? () => openV2DeptModal(dept.id, crumbs) : null;
}

function buildTreeV2(data) {
  DEPT_REGISTRY = {};
  V2_BLOCK_DATA = data;
  buildV2Registries(data);
  const inner = document.getElementById('canvas-inner');
  const svg   = document.getElementById('tree-svg');
  inner.innerHTML = '';
  inner.appendChild(svg);
  svg.innerHTML = '';
  CONNECTOR_HSEGS = [];

  const V2_CW = 170, V2_CH = 196;
  const V2_INNER_CW = 170, V2_NESTED_GAP = 9;
  const VG1 = 120, VG2 = 120, HG = 80, HG_SLOT = 120, HG_GROUP = 120, START_X = 60, START_Y = 40;

  const heads   = data.heads   || [];
  const persons = v2ApplyFold(data).persons || [];

  function nestedCardW(n) { return n * V2_INNER_CW + (n - 1) * V2_NESTED_GAP; }
  function personCardW(p) { return p.nested ? p.nested.length * 170 + Math.max(0, p.nested.length - 1) * 4 : V2_CW; }
  function childrenRowW(p) {
    const ch = p.children || [];
    return ch.length ? ch.length * V2_CW + (ch.length - 1) * HG : 0;
  }
  // Группы веток под внутренними карточками наборной: каждая стремится встать под свою
  // карточку, но между группами — стандартный зазор HG; при нехватке места группы
  // расходятся в обе стороны. Координаты — относительно центра наборной карточки
  function nestedGroups(p) {
    if (!p.nested) return { groups: [], left: 0, right: 0 };
    const half = personCardW(p) / 2;
    const groups = [];
    p.nested.forEach((n, k) => {
      let w = 0;
      if (n.children && n.children.length) w = n.children.length * V2_CW + (n.children.length - 1) * HG;
      else if (n.childBlock) w = n.childBlock.depts.length * 170 + Math.max(0, n.childBlock.depts.length - 1) * 4;
      if (!w) return;
      const ideal = k * (170 + 4) + 85 - half - w / 2;
      groups.push({ k, w, ideal, left: ideal });
    });
    for (let i = 1; i < groups.length; i++)
      groups[i].left = Math.max(groups[i].left, groups[i - 1].left + groups[i - 1].w + HG);
    if (groups.length) {   // сдвиг назад на средний сдвиг — чтобы расходились в обе стороны
      const shift = groups.reduce((s, g) => s + g.left - g.ideal, 0) / groups.length;
      groups.forEach(g => { g.left = Math.round(g.left - shift); });
    }
    const last = groups[groups.length - 1];
    return {
      groups,
      left: Math.min(-half, groups.length ? groups[0].left : 0),
      right: Math.max(half, last ? last.left + last.w : 0),
    };
  }
  function nestedChildrenW(p) {
    if (!p.nested) return 0;
    const ng = nestedGroups(p);
    return ng.groups.length ? 2 * Math.max(-ng.left, ng.right) : 0;   // карточка — по центру слота
  }
  function childrenChildBlockW(p) {
    return (p.children || []).reduce((max, c) => {
      if (!c.childBlock) return max;
      const n = c.childBlock.depts.length;
      return Math.max(max, n * V2_CW + Math.max(0, n - 1) * HG);
    }, 0);
  }
  // Слот колонки: сколько места нужно слева и справа от центра карточки. Ветки наборной
  // карточки могут расходиться несимметрично — слот тогда тоже несимметричный, без пустой половины
  function personExt(p) {
    const half = Math.max(personCardW(p), childrenRowW(p), childrenChildBlockW(p)) / 2;
    let L = half, R = half;
    if (p.nested) {
      const ng = nestedGroups(p);
      if (ng.groups.length) { L = Math.max(L, -ng.left); R = Math.max(R, ng.right); }
    }
    return { L, R };
  }

  const exts    = persons.map(personExt);
  const slots   = exts.map(e => e.L + e.R);

  // Карточки 2-го уровня с полем sub висят под своей внутренней карточкой руководителя
  // (наборная шапка «1 руководитель + отделы»). Группы встают под свою карточку с обычным
  // зазором и при нехватке места расходятся в обе стороны. Координаты — от центра шапки
  const bySub = data.headsDepts && heads.length === 1 && persons.some(p => Number.isInteger(p.sub));
  let personRel = null, sourceRel = null, spanL = 0, spanR = 0;
  if (bySub) {
    const n = data.headsDepts.length, headW = n * 170 + (n - 1) * 4;
    const groups = [];
    persons.forEach((p, i) => {
      const k = Number.isInteger(p.sub) ? p.sub : null;
      let g = groups.find(x => x.k === k);
      if (!g) groups.push(g = { k, idx: [], src: k === null ? 0 : k * 174 + 85 - headW / 2 });
      g.idx.push(i);
    });
    groups.sort((a, b) => a.src - b.src);
    groups.forEach(g => { g.w = g.idx.reduce((s, i) => s + slots[i], 0) + (g.idx.length - 1) * HG_SLOT; g.left = g.ideal = g.src - g.w / 2; });
    for (let i = 1; i < groups.length; i++) groups[i].left = Math.max(groups[i].left, groups[i - 1].left + groups[i - 1].w + HG_SLOT);
    const shift = groups.reduce((s, g) => s + g.left - g.ideal, 0) / groups.length;
    personRel = []; sourceRel = [];
    groups.forEach(g => {
      let x = g.left - shift;
      g.idx.forEach(i => { personRel[i] = x + exts[i].L; sourceRel[i] = g.src; x += slots[i] + HG_SLOT; });
    });
    spanL = Math.max(headW / 2, ...persons.map((p, i) => exts[i].L - personRel[i]));
    spanR = Math.max(headW / 2, ...persons.map((p, i) => personRel[i] + exts[i].R));
  }
  const totalW  = bySub ? spanL + spanR
    : slots.reduce((s, w) => s + w, 0) + Math.max(0, persons.length - 1) * HG_SLOT;
  const centerX = START_X + (bySub ? spanL : totalW / 2);

  // === HEADS ===
  let headsEl;
  const crumbsHead = [{ label: data.blockName, type: 'block', data }];

  if (data.headsDepts && data.headsDepts.length && heads.length === 1) {
    // 3й вариант: общий header (руководитель) + N под-карточек с их отделами
    const depts = data.headsDepts.map(d => ({
      person: d.person,
      deptName: d.deptName,
      isLink: !!(d.link || d.treeId),
      onDeptClick: d.treeId
        ? () => openTree(state.companyId, d.treeId, d.deptName.replace(/\n/g, ' '))
        : (d.deptId ? () => openV2DeptModal(d.deptId, crumbsHead) : null)
    }));
    headsEl = makeMultiDeptV2El(heads[0], depts);
    // Клик на общий header → модалка руководителя
    const headWrapEl = headsEl.querySelector('.card-v3__head-wrap');
    if (headWrapEl) {
      headWrapEl.style.cursor = 'pointer';
      headWrapEl.addEventListener('click', (e) => { e.stopPropagation(); openV2PersonModal(heads[0].id, crumbsHead); });
    }
    // Клик на под-карточки → модалки суб-руководителей
    headsEl.querySelectorAll('.card-v3__sub .card-v2').forEach((card, idx) => {
      if (!data.headsDepts[idx]) return;
      const personId = data.headsDepts[idx].person.id;
      const handler = (e) => { e.stopPropagation(); openV2PersonModal(personId, crumbsHead); };
      const subWrap = card.querySelector('.card-v2__body');
      if (subWrap) { subWrap.style.cursor = 'pointer'; subWrap.addEventListener('click', handler); }
      const subBody = card.querySelector('.card-v2-mh__body');
      if (subBody) { subBody.style.cursor = 'pointer'; subBody.addEventListener('click', handler); }
    });
  } else {
    // 1й / 2й вариант: один или несколько руководителей над одной группой
    headsEl = makeMultiHeadV2El(heads, data.blockName, data);
    headsEl.querySelectorAll('.card-v2').forEach((card, idx) => {
      if (!heads[idx]) return;
      const handler = (e) => { e.stopPropagation(); openV2PersonModal(heads[idx].id, crumbsHead); };
      const hBody = card.querySelector('.card-v2__body');
      if (hBody) { hBody.style.cursor = 'pointer'; hBody.addEventListener('click', handler); }
      const textBody = card.querySelector('.card-v2-mh__body');
      if (textBody) { textBody.addEventListener('click', handler); }
    });
  }
  const headsNode = document.createElement('div');
  headsNode.className = 'tree-node';
  headsNode.style.top = START_Y + 'px';

  if (data.showCompare) {
    // Одиночная карточка рядом для визуального сравнения высот
    const compareEl = makeMultiHeadV2El(
      [{ id: 'kal-cmp', name: 'ИВАНОВ Д.А.', role: 'Директор строительства', photo: null }],
      'Строительный департамент', null
    );
    const compareRow = document.createElement('div');
    compareRow.style.cssText = 'display:flex;gap:20px;align-items:flex-start;';
    const label1 = document.createElement('div');
    label1.style.cssText = 'position:absolute;top:-20px;left:0;font-size:10px;color:#aaa;white-space:nowrap;';
    label1.textContent = '3й вариант';
    const label2 = document.createElement('div');
    label2.style.cssText = 'position:absolute;top:-20px;left:0;font-size:10px;color:#aaa;white-space:nowrap;';
    label2.textContent = 'одиночная';
    const wrap1 = document.createElement('div');
    wrap1.style.cssText = 'position:relative;';
    wrap1.appendChild(label1); wrap1.appendChild(headsEl);
    const wrap2 = document.createElement('div');
    wrap2.style.cssText = 'position:relative;';
    wrap2.appendChild(label2); wrap2.appendChild(compareEl);
    compareRow.appendChild(wrap1);
    compareRow.appendChild(wrap2);
    headsNode.appendChild(compareRow);
  } else {
    headsNode.appendChild(headsEl);
  }
  inner.appendChild(headsNode);
  // Measure after append
  const headsH = headsEl.offsetHeight || V2_CH;
  const headsW2 = headsEl.offsetWidth || (heads.length > 1 ? heads.length * V2_CW + (heads.length - 1) * 6 : V2_CW);
  headsNode.style.left = data.showCompare ? START_X + 'px' : (centerX - headsW2 / 2) + 'px';

  const headsBottomY = START_Y + headsH;
  const personsY     = headsBottomY + VG1;
  const childrenY    = personsY + V2_CH + VG2;
  const branchY      = personsY - Math.round(VG1 / 2);

  // === PERSONS ===
  let px = centerX - totalW / 2;
  persons.forEach((p, i) => {
    const slotW   = slots[i];
    const slotCX  = bySub ? centerX + personRel[i] : px + exts[i].L;   // центр карточки (слот может быть несимметричным)
    const cardW   = personCardW(p);
    const cardX   = slotCX - cardW / 2;

    const blockCrumb  = [{ label: data.blockName, type: 'block', data }];
    const personCrumb = [...blockCrumb, { label: p.fullName || p.name, type: 'person', id: p.id }];
    let personEl;
    if (p.nested) {
      const head = { id: p.id, name: p.name, fullName: p.fullName, role: p.role, photo: p.photo, deputy: p.deputy, deps: p.deps };
      const depts = p.nested.map(n => ({
        person: { id: n.id, name: n.name, fullName: n.fullName, role: n.role, photo: n.photo, deputy: n.deputy, deps: n.deps },
        deptName: n.dept ? n.dept.name.replace(/\n/g, ' ') : null,
        isLink: !!(n.dept && n.dept.link),
        onDeptClick: n.dept
          ? (n.dept.treeId
              ? () => openTree(state.companyId, n.dept.treeId, n.dept.name.replace(/\n/g, ' '))
              : (n.dept.id ? () => openV2DeptModal(n.dept.id, null) : null))
          : null,
      }));
      personEl = makeMultiDeptV2El(head, depts);
      const headWrap = personEl.querySelector('.card-v3__head-wrap');
      if (headWrap) { headWrap.style.cursor = 'pointer'; headWrap.addEventListener('click', e => { e.stopPropagation(); openV2PersonModal(p.id, null); }); }
      personEl.querySelectorAll('.card-v3__sub .card-v2').forEach((card, idx) => {
        const item = p.nested[idx];
        if (!item) return;
        const handler = e => { e.stopPropagation(); openV2PersonModal(item.id, null); };
        const subWrap = card.querySelector('.card-v2__body');
        if (subWrap) { subWrap.style.cursor = 'pointer'; subWrap.addEventListener('click', handler); }
        const subBody = card.querySelector('.card-v2-mh__body');
        if (subBody) { subBody.style.cursor = 'pointer'; subBody.addEventListener('click', handler); }
      });
    } else {
      personEl = makeMultiHeadV2El([p], p.dept ? p.dept.name : null, v2DeptClick(p.dept, null), v2IsLink(p.dept), p.deputy ? 'tall' : 'short');
      v2WirePersonClick(personEl, p, data, null);
    }
    const personNode = document.createElement('div');
    personNode.className = 'tree-node';
    personNode.style.top  = personsY + 'px';
    personNode.style.left = cardX + 'px';
    personNode.appendChild(personEl);
    if (personEl.matches('.card-v2-multi--short, .card-v2-multi--tall')) personNode.classList.add('tree-node--bottom');
    inner.appendChild(personNode);
    personNode.dataset.pid = p.id;
    v2AddFoldButton(personNode, p._fold);
    v2AddInnerButton(personNode, p._innerFold);
    (p.nested || []).forEach((n, k) => v2AddFoldButton(personNode, n._fold, k * (170 + 4) + 85));

    addConnector(svg, bySub ? centerX + sourceRel[i] : centerX, headsBottomY, slotCX, personsY, branchY);

    // === CHILDREN ===
    const children = p.children || [];
    if (children.length) {
      const personH  = personNode.offsetHeight || V2_CH;
      const rowW  = childrenRowW(p);
      const childBranchY = childrenY - Math.round(VG2 / 2);
      let cx = slotCX - rowW / 2;
      const parentDeptCrumb = p.dept && p.dept.id ? { label: (p.dept.name || '').replace(/\n/g,' '), type: 'dept', id: p.dept.id } : null;
      const childCrumbs = parentDeptCrumb ? [...blockCrumb, parentDeptCrumb] : blockCrumb;
      children.forEach(c => {
        const childCX = cx + V2_CW / 2;
        const cDeptName = typeof c.dept === 'string' ? c.dept : (c.dept ? c.dept.name : null);
        const cDeptLink = v2IsLink(c.dept);
        const cDeptId   = c.dept && c.dept.id;
        const childEl = makeMultiHeadV2El([c], cDeptName,
          v2DeptClick(c.dept, childCrumbs), cDeptLink, c.deputy ? 'tall' : 'short');
        v2WirePersonClick(childEl, c, data, p.dept ? p.dept.id : null);
        const childNode = document.createElement('div');
        childNode.className = 'tree-node';
        childNode.style.top  = childrenY + 'px';
        childNode.style.left = cx + 'px';
        childNode.appendChild(childEl);
        if (childEl.matches('.card-v2-multi--short, .card-v2-multi--tall')) childNode.classList.add('tree-node--bottom');
        inner.appendChild(childNode);
        v2AddFoldButton(childNode, c._fold);
        addConnector(svg, slotCX, personsY + personH, childCX, childrenY, childBranchY);
        cx += V2_CW + HG;
      });

      // === CHILDREN'S CHILD BLOCKS ===
      const level2Y   = childrenY + V2_CH + VG2;
      const l2BranchY = level2Y - Math.round(VG2 / 2);
      let cx2 = slotCX - rowW / 2;
      children.forEach(c => {
        const childCX      = cx2 + V2_CW / 2;
        const childBottomY = childrenY + V2_CH;
        if (c.childBlock) {
          const cb  = c.childBlock;
          const n   = cb.depts.length;
          const cbW = n * V2_CW + Math.max(0, n - 1) * HG;
          let   dx  = childCX - Math.round(cbW / 2);
          const cCrumb = c.dept && c.dept.id
            ? { label: (c.dept.name || '').replace(/\n/g,' '), type: 'dept', id: c.dept.id } : null;
          const cbCrumbs = cCrumb ? [...blockCrumb, cCrumb] : blockCrumb;
          cb.depts.forEach(d => {
            const dCX  = dx + Math.round(V2_CW / 2);
            const dEl  = makeMultiHeadV2El(
              [d.person],
              d.deptName || null,
              d.deptId ? () => openV2DeptModal(d.deptId, cbCrumbs) : null,
              false, 'short'
            );
            v2WirePersonClick(dEl, d.person, data, c.dept ? c.dept.id : null);
            const dNode = document.createElement('div');
            dNode.className = 'tree-node';
            dNode.style.top  = level2Y + 'px';
            dNode.style.left = dx + 'px';
            dNode.appendChild(dEl);
            if (dEl.matches('.card-v2-multi--short, .card-v2-multi--tall')) dNode.classList.add('tree-node--bottom');
            inner.appendChild(dNode);
            addConnector(svg, childCX, childBottomY, dCX, level2Y, l2BranchY);
            dx += V2_CW + HG;
          });
        }
        cx2 += V2_CW + HG;
      });
    }
    // === NESTED ITEM CHILDREN ===
    const nestedW = nestedChildrenW(p);
    if (nestedW > 0 && p.nested) {
      const level1Y    = childrenY;
      const level2Y    = childrenY + V2_CH + VG2;
      const l1BranchY  = level1Y - Math.round(VG2 / 2);
      const l2BranchY  = level2Y - Math.round(VG2 / 2);

      const nGroups = nestedGroups(p).groups;
      p.nested.forEach((n, nIdx) => {
        const subCX      = cardX + nIdx * (170 + 4) + 85;
        const subBottomY = personsY + V2_CH;
        const grp = nGroups.find(g => g.k === nIdx);
        if (!grp) return;
        const grpW    = grp.w;
        const groupCX = slotCX + grp.left + grpW / 2;   // место группы — из nestedGroups

        if (n.children && n.children.length) {
          const grpLeft = groupCX - Math.round(grpW / 2);
          const nParentCrumb = n.dept && n.dept.id ? { label: (n.dept.name || '').replace(/\n/g,' '), type: 'dept', id: n.dept.id } : null;
          const nChildCrumbs = nParentCrumb ? [...personCrumb, nParentCrumb] : personCrumb;
          n.children.forEach((c, ci) => {
            const cLeft = grpLeft + ci * (V2_CW + HG);
            const cCX   = cLeft + Math.round(V2_CW / 2);
            const cDeptId = c.dept && c.dept.id;
            const cEl = makeMultiHeadV2El([c], c.dept ? c.dept.name : null,
              v2DeptClick(c.dept, nChildCrumbs), v2IsLink(c.dept), c.deputy ? 'tall' : 'short');
            v2WirePersonClick(cEl, c, data, null);
            const cNode = document.createElement('div');
            cNode.className = 'tree-node';
            cNode.style.top  = level1Y + 'px';
            cNode.style.left = cLeft + 'px';
            cNode.appendChild(cEl);
            if (cEl.matches('.card-v2-multi--short, .card-v2-multi--tall')) cNode.classList.add('tree-node--bottom');
            inner.appendChild(cNode);
            addConnector(svg, subCX, subBottomY, cCX, level1Y, l1BranchY);
          });

        } else if (n.childBlock) {
          const cbLeft = groupCX - Math.round(grpW / 2);
          const cbCX   = groupCX;
          const cb     = n.childBlock;
          const nCbParentCrumb    = n.dept && n.dept.id ? { label: (n.dept.name || '').replace(/\n/g,' '), type: 'dept', id: n.dept.id } : null;
          const nCbBaseCrumbs     = nCbParentCrumb ? [...personCrumb, nCbParentCrumb] : personCrumb;
          const cbHeadPersonCrumb = { label: cb.head.fullName || cb.head.name, type: 'person', id: cb.head.id };
          const cbDeptCrumbs      = [...nCbBaseCrumbs, cbHeadPersonCrumb];
          const cbEl = makeMultiDeptV2El(cb.head, cb.depts.map(d => ({
            person: d.person, deptName: d.deptName,
            onDeptClick: d.deptId ? () => openV2DeptModal(d.deptId, cbDeptCrumbs) : null,
          })));
          const cbHeadWrap = cbEl.querySelector('.card-v3__head-wrap');
          if (cbHeadWrap) {
            cbHeadWrap.style.cursor = 'pointer';
            cbHeadWrap.addEventListener('click', e => { e.stopPropagation(); openV2PersonModal(cb.head.id, nCbBaseCrumbs); });
          }
          cbEl.querySelectorAll('.card-v3__sub .card-v2').forEach((card, di) => {
            const dept = cb.depts[di];
            if (!dept || !dept.person) return;
            const handler = e => { e.stopPropagation(); openV2PersonModal(dept.person.id, cbDeptCrumbs); };
            const sw = card.querySelector('.card-v2__body');
            if (sw) { sw.style.cursor = 'pointer'; sw.addEventListener('click', handler); }
            const sb = card.querySelector('.card-v2-mh__body');
            if (sb) { sb.style.cursor = 'pointer'; sb.addEventListener('click', handler); }
          });
          const cbNode = document.createElement('div');
          cbNode.className = 'tree-node';
          cbNode.style.top  = level1Y + 'px';
          cbNode.style.left = cbLeft + 'px';
          cbNode.appendChild(cbEl);
          inner.appendChild(cbNode);
          v2AddFoldButton(cbNode, cb._fold);
          addConnector(svg, subCX, subBottomY, cbCX, level1Y, l1BranchY);

          cb.depts.forEach((dept, di) => {
            if (!dept.children || !dept.children.length) return;
            const deptSubCX      = cbLeft + di * (170 + 4) + 85;
            const deptSubBottomY = level1Y + V2_CH;
            const l3RowW  = dept.children.length * V2_CW + (dept.children.length - 1) * HG;
            const l3Start = deptSubCX - Math.round(l3RowW / 2);
            const gcParentCrumb = dept.deptId ? { label: dept.deptName || '', type: 'dept', id: dept.deptId } : null;
            const gcCrumbs = gcParentCrumb ? [...cbDeptCrumbs, gcParentCrumb] : cbDeptCrumbs;
            dept.children.forEach((gc, gi) => {
              const gcLeft = l3Start + gi * (V2_CW + HG);
              const gcCX   = gcLeft + Math.round(V2_CW / 2);
              const gcDeptId = gc.dept && gc.dept.id;
              const gcEl = makeMultiHeadV2El([gc], gc.dept ? gc.dept.name : null,
                v2DeptClick(gc.dept, gcCrumbs), v2IsLink(gc.dept), 'short');
              v2WirePersonClick(gcEl, gc, data, null);
              const gcNode = document.createElement('div');
              gcNode.className = 'tree-node';
              gcNode.style.top  = level2Y + 'px';
              gcNode.style.left = gcLeft + 'px';
              gcNode.appendChild(gcEl);
              if (gcEl.matches('.card-v2-multi--short, .card-v2-multi--tall')) gcNode.classList.add('tree-node--bottom');
              inner.appendChild(gcNode);
              addConnector(svg, deptSubCX, deptSubBottomY, gcCX, level2Y, l2BranchY);
            });
          });
        }
      });
    }

    px += slotW + HG_SLOT;
  });

  // Size SVG
  const hasL2nested = persons.some(p => p.nested && p.nested.some(n => n.childBlock && n.childBlock.depts && n.childBlock.depts.some(d => d.children && d.children.length)));
  const hasL1nested = persons.some(p => p.nested && p.nested.some(n => (n.children && n.children.length) || n.childBlock));
  const hasRegChildren = persons.some(p => (p.children || []).length);
  const hasChildrenChildBlock = persons.some(p => (p.children || []).some(c => c.childBlock));
  const level2AbsY = childrenY + V2_CH + VG2;
  const totalH = (hasL2nested || hasChildrenChildBlock ? level2AbsY + V2_CH : (hasL1nested || hasRegChildren) ? childrenY + V2_CH : personsY + V2_CH) + 60;
  const canvasW = totalW + 2 * START_X;
  svg.setAttribute('width',  canvasW);
  svg.setAttribute('height', totalH);
  inner.style.width  = canvasW + 'px';
  inner.style.height = totalH + 'px';

  v2SyncFoldAll();
  applyTransform();
}

function addLine(svg, x1, y1, x2, y2) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  el.setAttribute('x1', x1); el.setAttribute('y1', y1);
  el.setAttribute('x2', x2); el.setAttribute('y2', y2);
  el.setAttribute('stroke', 'var(--canvas-line)');
  el.setAttribute('stroke-width', '1.5');
  el.setAttribute('stroke-linecap', 'round');
  svg.appendChild(el);
}


// Горизонтальные участки линий текущего дерева — чтобы линии разных родителей
// не сливались: если участок пересекается с чужим на той же высоте, он поднимается на CONNECTOR_HOP
let CONNECTOR_HSEGS = [];
const CONNECTOR_HOP = 8;

// Сколько от верха узла до верха карточки: узел .tree-node--bottom выше низкой карточки
function v2CardTopOffset(node) {
  if (!node || !node.classList.contains('tree-node--bottom')) return 0;
  const card = node.firstElementChild;
  return card ? card.offsetTop : 0;
}

function addConnector(svg, px, py, cx, cy, branchY) {
  // линия ведёт к карточке, только что добавленной на холст: у низкой — до её верха, а не до верха узла
  const lastNode = svg.parentNode && svg.parentNode.lastElementChild;
  if (lastNode && lastNode.classList.contains('tree-node')) cy += v2CardTopOffset(lastNode);
  let midY = branchY !== undefined ? branchY : Math.round((py + cy) / 2);
  const dx   = cx - px;
  const owner = px + ',' + py;
  if (Math.abs(dx) >= 1) {
    const x1 = Math.min(px, cx), x2 = Math.max(px, cx);
    const own = CONNECTOR_HSEGS.find(sg => sg.owner === owner && sg.baseY === midY);
    if (own) midY = own.y;             // у одного родителя все ветки на общей высоте
    else {
      const clash = y => CONNECTOR_HSEGS.some(sg => sg.owner !== owner && Math.abs(sg.y - y) < 1 && sg.x1 < x2 && sg.x2 > x1);
      const base = midY;
      while (clash(midY)) midY -= CONNECTOR_HOP;
      CONNECTOR_HSEGS.push({ owner, baseY: base, y: midY, x1, x2 });
    }
    const sg = CONNECTOR_HSEGS.find(g => g.owner === owner && g.y === midY);
    if (sg) { sg.x1 = Math.min(sg.x1, x1); sg.x2 = Math.max(sg.x2, x2); }
  }
  const el   = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  el.setAttribute('stroke', 'var(--canvas-line)');
  el.setAttribute('stroke-width', '1.5');
  el.setAttribute('fill', 'none');
  el.setAttribute('stroke-linecap', 'round');
  const geom = { px, py, cx, cy, midY };
  el.setAttribute('d', connectorD(geom));
  el.dataset.geom = JSON.stringify(geom);
  // Ключ линии — карточка, к которой она ведёт (её узел только что добавлен на холст):
  // по нему при сворачивании линия перетекает из старой формы в новую
  const last = svg.parentNode && svg.parentNode.lastElementChild;
  const key = last && last.classList.contains('tree-node') ? v2NodeKey(last) : null;
  if (key) el.dataset.key = key;
  svg.appendChild(el);
}

// Путь линии всегда одной структуры (M L Q L Q L), даже прямой — чтобы форму можно было
// плавно интерполировать от старой к новой
function connectorD({ px, py, cx, cy, midY }) {
  const dx = cx - px;
  const r = Math.max(0, Math.min(10, Math.abs(dx) / 2, (midY - py) / 2, (cy - midY) / 2));
  const s = dx >= 0 ? 1 : -1;
  return `M ${px} ${py} L ${px} ${midY - r} Q ${px} ${midY} ${px + s*r} ${midY} `
       + `L ${cx - s*r} ${midY} Q ${cx} ${midY} ${cx} ${midY + r} L ${cx} ${cy}`;
}

/* ====================================================================
   PAN & ZOOM
==================================================================== */
function applyTransform() {
  document.getElementById('canvas-inner').style.transform =
    `translate(${canvas.x}px,${canvas.y}px) scale(${canvas.scale})`;
  syncZoomSlider();
}
function syncZoomSlider() {
  const sl = document.getElementById('zoom-slider');
  if (!sl) return;
  const val = Math.round((canvas.scale - 0.25) / 2.75 * 100);
  sl.value = val;
  sl.style.background = `linear-gradient(to right,#e2221c 0%,#e2221c ${val}%,#f6f6f6 ${val}%,#f6f6f6 100%)`;
}
function onZoomSlider(val) {
  const wrapper = document.getElementById('canvas-wrapper');
  const r = wrapper.getBoundingClientRect();
  const newScale = Math.max(0.25, Math.min(3, 0.25 + (val / 100) * 2.75));
  const ratio = newScale / canvas.scale;
  canvas.x = r.width  / 2 - (r.width  / 2 - canvas.x) * ratio;
  canvas.y = r.height / 2 - (r.height / 2 - canvas.y) * ratio;
  canvas.scale = newScale;
  applyTransform();
}
function zoomFromPoint(factor, px, py) {
  const newScale = Math.max(0.25, Math.min(3, canvas.scale * factor));
  const ratio = newScale / canvas.scale;
  canvas.x = px - (px - canvas.x) * ratio;
  canvas.y = py - (py - canvas.y) * ratio;
  canvas.scale = newScale;
  applyTransform();
}
function zoom(factor) {
  const wrapper = document.getElementById('canvas-wrapper');
  const r = wrapper.getBoundingClientRect();
  zoomFromPoint(factor, r.width / 2, r.height / 2);
}
function zoomStep(dir) { zoom(dir > 0 ? 1.2 : 1 / 1.2); }
function centerView(fitContent) {
  const wrapper = document.getElementById('canvas-wrapper');
  const inner   = document.getElementById('canvas-inner');
  const contentW = parseFloat(inner.style.width)  || 0;
  const contentH = parseFloat(inner.style.height) || 0;
  const wRect   = wrapper.getBoundingClientRect();
  if (fitContent && contentW && contentH) {
    const scaleX = (wRect.width  - 80) / contentW;
    const scaleY = (wRect.height - 80) / contentH;
    // 0.25 — как минимум ползунка. Сверху — 100% при полотне по макету (1488px); полотно шире
    // (2К) — дерево крупнее пропорционально, чтобы не терялось на большом экране
    const maxFit = Math.max(1, wRect.width / 1488);
    canvas.scale = Math.round(Math.max(0.25, Math.min(maxFit, scaleX, scaleY)) * 100) / 100;
  }
  canvas.x = Math.round((wRect.width  - contentW * canvas.scale) / 2);
  canvas.y = Math.round((wRect.height - contentH * canvas.scale) / 4);
  applyTransform();
}
function resetView() { centerView(true); clearHighlight(); }

function setupCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  let _clickStart = null, _didDrag = false;
  wrapper.onmousedown = e => {
    clearHighlight();
    panning = true;
    _didDrag = false;
    _clickStart = { x: e.clientX, y: e.clientY };
    panOrigin = { x: e.clientX - canvas.x, y: e.clientY - canvas.y };
    wrapper.classList.add('panning');
    e.preventDefault();
  };
  document.onmousemove = e => {
    if (!panning) return;
    if (_clickStart && !_didDrag) {
      const dx = Math.abs(e.clientX - _clickStart.x);
      const dy = Math.abs(e.clientY - _clickStart.y);
      if (dx > 5 || dy > 5) _didDrag = true;
    }
    canvas.x = e.clientX - panOrigin.x;
    canvas.y = e.clientY - panOrigin.y;
    applyTransform();
  };
  document.onmouseup = e => {
    if (panning && _clickStart) {
      const dx = Math.abs(e.clientX - _clickStart.x);
      const dy = Math.abs(e.clientY - _clickStart.y);
      if (dx < 5 && dy < 5) clearHighlight();
      if (_didDrag) {
        document.addEventListener('click', e => e.stopPropagation(), { capture: true, once: true });
      }
    }
    panning = false;
    _clickStart = null;
    _didDrag = false;
    document.getElementById('canvas-wrapper')?.classList.remove('panning');
  };
  wrapper.onwheel = e => {
    e.preventDefault();
    const r = wrapper.getBoundingClientRect();
    zoomFromPoint(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
  };
}

/* ====================================================================
   ПОИСК
==================================================================== */
function onSearch(val) {
  const dd = document.getElementById('search-dd');
  if (!val.trim()) { dd.classList.remove('open'); return; }
  const q = val.toLowerCase();

  if (V2_BLOCK_DATA) {
    const personHits = Object.values(V2_PERSON_REG).filter(p => {
      return wordMatch(p.fullName || p.name, q) || wordMatch((p.role || '').replace(/\n/g,' '), q);
    }).map(p => ({
      _v2: true, id: p.id,
      name: p.fullName || p.name,
      role: (p.role || '').replace(/\n/g,' '),
      crumbs: V2_CRUMB_MAP[p.id] || [],
    }));
    const deptHits = Object.entries(V2_DEPT_REG).filter(([, d]) => {
      return wordMatch(d.name, q);
    }).map(([id, d]) => ({
      _v2dept: true, id,
      name: (d.name || '').replace(/\n/g,' '),
      role: '',
      crumbs: V2_DEPT_CRUMB_MAP[id] || [],
    }));
    const combined = [...personHits, ...deptHits].slice(0, 14);
    _searchResults = combined;
    if (!combined.length) { dd.classList.remove('open'); return; }
    dd.innerHTML = combined.map((e, i) => `
      <div class="sd-item" onmousedown="selectSearchResult(${i})">
        <div class="sd-name">${escHtml(e.name)}</div>
        <div class="sd-role">${escHtml(e.role || 'Отдел / Дирекция')}</div>
      </div>`).join('');
    dd.classList.add('open');
    return;
  }

  _searchResults = SEARCH_INDEX.filter(e =>
    wordMatch(e.name, q) || wordMatch(e.role, q)
  ).slice(0, 14);
  if (!_searchResults.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = _searchResults.map((e, i) => `
    <div class="sd-item" onmousedown="selectSearchResult(${i})">
      <div class="sd-name">${e.name}</div>
      <div class="sd-role">${e.role}${e.context ? ` <span style="opacity:.4">·</span> ${e.context}` : ''}</div>
    </div>`).join('');
  dd.classList.add('open');
}
function closeSearch() { document.getElementById('search-dd').classList.remove('open'); }

function selectSearchResult(i) {
  const entry = _searchResults[i];
  if (!entry) return;
  if (entry._v2) {
    resetSearchInput(document.getElementById('search-input'));
    closeSearch();
    highlightV2Person(entry.id);
    openV2PersonModal(entry.id, entry.crumbs || []);
    return;
  }
  if (entry._v2dept) {
    resetSearchInput(document.getElementById('search-input'));
    closeSearch();
    openV2DeptModal(entry.id, entry.crumbs || []);
    return;
  }
  jumpToEmployee(entry);
}

function clearHighlight() {
  document.querySelectorAll('.card-person.hl, .card-head.hl, .card-div.hl, .card-emp-node.hl').forEach(el => el.classList.remove('hl'));
  document.querySelectorAll('.card-v2.hl').forEach(el => el.classList.remove('hl'));
  document.querySelectorAll('.card-v2-multi__dept.hl').forEach(el => el.classList.remove('hl'));
}

function highlightV2Person(personId) {
  clearHighlight();
  const findCard = () => document.querySelector(`.card-v2[data-v2-pid="${personId}"], .card-v3[data-v2-pid="${personId}"]`);
  let cardEl = findCard();
  if (!cardEl && v2UnfoldTo(personId)) { buildTreeV2(V2_BLOCK_DATA); cardEl = findCard(); }
  if (!cardEl) return;
  cardEl.classList.add('hl');

  // Для позиционирования берём весь визуальный контейнер
  const posRoot = cardEl.closest('.card-v3__sub')
               || cardEl.closest('.card-v2-multi')
               || cardEl;

  // Подсвечиваем подложку группы
  const deptEl = posRoot.querySelector('.card-v2-multi__dept');
  if (deptEl) deptEl.classList.add('hl');

  const wrapper = document.getElementById('canvas-wrapper');
  const wRect   = wrapper.getBoundingClientRect();
  const modal   = document.getElementById('v2-modal');
  const modalW  = (modal && modal.offsetWidth) || 500;

  const cardRect = posRoot.getBoundingClientRect();
  const cardCX   = cardRect.left + cardRect.width  / 2;
  const cardCY   = cardRect.top  + cardRect.height / 2;

  const targetCX = wRect.left + (wRect.width - modalW) / 2;
  const targetCY = wRect.top  + wRect.height / 2 - 40;

  canvas.x += Math.round(targetCX - cardCX);
  canvas.y += Math.round(targetCY - cardCY);
  applyTransform();
}

function jumpToEmployee(entry) {
  clearHighlight();
  const nodeEl = document.querySelector(`[data-node-id="${entry.nodeId}"]`);
  if (nodeEl) {
    const card = (nodeEl.classList.contains('card-head') || nodeEl.classList.contains('card-person') || nodeEl.classList.contains('card-div') || nodeEl.classList.contains('card-emp-node'))
      ? nodeEl
      : (nodeEl.querySelector('.card-emp-node') || nodeEl.querySelector('.card-div') || nodeEl.querySelector('.card-person') || nodeEl.querySelector('.card-head'));
    if (card) card.classList.add('hl');
    /* для head-карточек style.left не задан — поднимаемся к .tree-node */
    const posEl = nodeEl.style.left ? nodeEl : (nodeEl.closest('.tree-node') || nodeEl);
    const nx = parseInt(posEl.style.left) || 0;
    const ny = parseInt(posEl.style.top)  || 0;
    const wrapper = document.getElementById('canvas-wrapper');
    const wRect = wrapper.getBoundingClientRect();
    canvas.x = Math.round(wRect.width  / 2 - (nx + DW / 2) * canvas.scale);
    canvas.y = Math.round(wRect.height / 2 - (ny + DH / 2) * canvas.scale);
    applyTransform();
  }
  openPersonPanel(entry.key, null, entry.path);
  resetSearchInput(document.getElementById('search-input'));
  closeSearch();
}

}

function initials(name) {
  const parts = name.replace(/\n/g,' ').trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return parts[0][0].toUpperCase();
}

const AVATAR_COLORS = ['#F2D9D4','#D4EAE2','#D4DEF0','#E0D8F0','#F0E8D4','#D0E8E4','#EDD8E8','#E0EAD0'];
function avatarColor(name) {
  const key = name.toLowerCase().replace(/[\s\n]+/g, '');
  let h = 0;
  for (let i = 0; i < key.length; i++) h = key.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

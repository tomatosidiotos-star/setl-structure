function buildDivCardHTML(d) {
  DEPT_REGISTRY[d.id] = d;
  (d.employees || []).forEach((e, i) => { DEPT_REGISTRY['emp-' + d.id + '-' + i] = e; });
  const mgr = d.manager || {};
  const mgrName  = typeof mgr === 'string' ? mgr : (mgr.name  || '');
  const mgrPhoto = typeof mgr === 'object' && mgr ? mgr.photo : null;
  const mgrKey   = 'mgr-' + d.id;
  if (mgrName) {
    DEPT_REGISTRY[mgrKey] = { name: mgrName, photo: mgrPhoto, role: 'Руководитель', division: d.name };
  }

  const avatar = mgrPhoto
    ? `<img src="${mgrPhoto}">`
    : initials(mgrName);

  const mgrChip = mgrName ? `
    <div class="cdiv-manager-chip" onclick="event.stopPropagation(); openPersonPanel('${mgrKey}')">
      <div class="cdiv-manager-avatar">${avatar}</div>
      <div class="cdiv-manager-name">${mgrName}</div>
    </div>` : '';

  const empCount = d.count != null ? d.count : (d.employees ? d.employees.length : null);
  const openFn   = (d.children && d.children.length) ? `openDivisionPanel('${d.id}')` : `openTeamPanel('${d.id}')`;
  const empChip  = empCount != null ? `
    <div class="cdiv-emp-chip" onclick="event.stopPropagation(); ${openFn}">
      <div class="cdiv-emp-left"><svg width="13" height="13" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="4" r="2.5"/><path d="M1 13c0-2.5 1.8-4 4-4s4 1.5 4 4"/><circle cx="13" cy="4" r="2.5"/><path d="M17 13c0-2.5-1.8-4-4-4"/><line x1="10" y1="13" x2="8" y2="13"/></svg> ${empCount}</div>
      <svg class="cdiv-emp-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6h8M6 2l4 4-4 4"/></svg>
    </div>` : '';

  return `
    <div class="cdiv-title">${d.name.replace(/\n/g,'<br>')}</div>
    <div class="cdiv-bottom">${mgrChip}${empChip}</div>`;
}

/* Рисует вертикальный стек карточек сотрудников ниже родительского отдела */
function renderEmpRow(inner, svg, division, parentCx, parentBottomY) {
  const emps = division.employees || [];
  if (!emps.length) return;
  const GAP_TOP  = 16;  // от нижней границы отдела до первого сотрудника
  const GAP_ITEM =  6;  // между карточками сотрудников
  const ex = parentCx - EW / 2;
  let   ey = parentBottomY + GAP_TOP;

  addLine(svg, parentCx, parentBottomY, parentCx, ey);

  emps.forEach((e, i) => {
    const key = 'emp-' + division.id + '-' + i;
    DEPT_REGISTRY[key] = e;

    const eNode = document.createElement('div');
    eNode.className = 'tree-node';
    eNode.dataset.nodeId = key;
    eNode.style.left = ex + 'px';
    eNode.style.top  = ey + 'px';

    const eCard = document.createElement('div');
    eCard.className = 'card-emp-node';
    eCard.innerHTML = `
      <div class="card-emp-node-avatar">${e.photo ? `<img src="${e.photo}">` : initials(e.name)}</div>
      <div class="card-emp-node-info">
        <div class="card-emp-node-name">${e.name}</div>
        ${e.role ? `<div class="card-emp-node-role">${e.role}</div>` : ''}
      </div>`;
    eCard.onclick = () => openPersonPanel(key);
    eNode.appendChild(eCard);
    inner.appendChild(eNode);

    ey += EH + GAP_ITEM;
  });
}

function renderOrgPath(path) {
  if (!path || !path.length) return '';
  const IC_P = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M2.5 13.5c0-3 2.5-4.5 5.5-4.5s5.5 1.5 5.5 4.5"/></svg>`;
  const IC_G = `<svg width="12" height="11" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="4" r="2.5"/><path d="M1 13c0-2.5 1.8-4 4-4s4 1.5 4 4"/><circle cx="13" cy="4" r="2.5"/><path d="M17 13c0-2.5-1.8-4-4-4"/><line x1="10" y1="13" x2="8" y2="13"/></svg>`;
  const rows = path.map((node, i) => {
    const icon = node.level === 2 ? IC_P : IC_G;
    const mgr  = node.manager ? `<div class="pc-org-mgr">${node.manager}</div>` : '';
    return `<div class="pc-org-row" style="padding-left:${i * 16}px"><div class="pc-org-icon">${icon}</div><div class="pc-org-body"><div class="pc-org-name">${node.name}</div>${mgr}</div></div>`;
  }).join('');
  return `<div class="pc-divider"></div><div class="pc-section-label">В структуре</div><div class="pc-org-tree">${rows}</div>`;
}

function openPersonPanel(key, backFn, pathInfo) {
  panelBack = backFn || null;
  const p = DEPT_REGISTRY[key];
  if (!p) return;
  if (pathInfo === undefined) {
    const entry = SEARCH_INDEX.find(e => e.key === key);
    pathInfo = entry ? entry.path : null;
  }
  document.getElementById('sp-title').textContent = 'Карточка сотрудника';

  const hasPhoto = !!p.photo;
  const avatarContent = hasPhoto ? `<img src="${p.photo}" alt="">` : initials(p.name);
  const avatarClick   = hasPhoto ? `onclick="showPhotoZoom('${p.photo}')"` : '';

  const f2 = (lbl, val) => `
    <div class="pc-field">
      <span class="pc-label">${lbl}</span>
      ${val ? `<span class="pc-value">${val}</span>` : `<span class="pc-value-dash">—</span>`}
    </div>`;

  const hasContacts = p.phone || p.mobile || p.email || p.birthday;

  const backBtn = panelBack ? `
    <button class="sp-back-btn" onclick="goBack()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
      Назад к списку
    </button>` : '';

  document.getElementById('sp-body').innerHTML = `
    ${backBtn}
    <div class="pc-hero">
      <div class="pc-avatar${hasPhoto ? ' has-photo' : ''}" ${avatarClick}>${avatarContent}</div>
      <div class="pc-info">
        <div class="pc-name">${p.name}</div>
        ${p.role ? `<div class="pc-role">${p.role.replace(/\n/g,'<br>')}</div>` : ''}
        ${p.division ? `<div class="pc-role" style="margin-top:3px;font-size:12px">${p.division}</div>` : ''}
      </div>
    </div>
    ${hasContacts ? `
    <div class="pc-row2">
      ${f2('Рабочий телефон', p.phone)}
      ${f2('Мобильный телефон', p.mobile)}
    </div>
    <div class="pc-row2">
      ${f2('День рождения', p.birthday)}
      ${f2('Email', p.email)}
    </div>
    <div class="pc-divider"></div>
    ` : ''}
    ${p.org        ? `<div class="pc-field" style="margin-bottom:14px"><span class="pc-label">Организация</span><span class="pc-value-link">${p.org}<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 10L10 2M10 2H5M10 2v5"/></svg></span></div>` : ''}
    ${p.department ? `<div class="pc-field" style="margin-bottom:14px"><span class="pc-label">Департамент</span><span class="pc-value-link">${p.department}<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 10L10 2M10 2H5M10 2v5"/></svg></span></div>` : ''}
    ${p.office     ? `<div class="pc-field"><span class="pc-label">Офис</span><span class="pc-value">${p.office}</span></div>` : ''}
    ${!hasContacts && !p.org && !p.department && !p.office ? `<p style="font-size:13px;color:var(--gray)">Контактные данные не указаны</p>` : ''}
    ${renderOrgPath(pathInfo)}`;
  openPanel();
}

function goBack() { if (panelBack) panelBack(); }

function openPersonPanelWithBack(empKey, teamId) {
  openPersonPanel(empKey, () => openTeamPanel(teamId));
}

function showPhotoZoom(src) {
  document.getElementById('photo-overlay-img').src = src;
  document.getElementById('photo-overlay').classList.add('vis');
}
function hidePhotoZoom() {
  document.getElementById('photo-overlay').classList.remove('vis');
}

function _backBtn() {
  return panelBack ? `<button class="sp-back-btn" onclick="goBack()"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg> Назад к списку</button>` : '';
}

function _mgrListItem(mgrKey, backType, backId) {
  const mgr = DEPT_REGISTRY[mgrKey];
  if (!mgr) return '';
  const av = mgr.photo ? `<img src="${mgr.photo}" alt="">` : initials(mgr.name);
  const clickFn = backType === 'div' ? `openPersonPanelFromDiv('${mgrKey}','${backId}')` : `openPersonPanelWithBack('${mgrKey}','${backId}')`;
  return `
    <div class="emp-list-item" onclick="${clickFn}">
      <div class="emp-list-avatar">${av}</div>
      <div>
        <div class="emp-list-name-row">
          <span class="emp-list-name">${mgr.name}</span>
          <span class="emp-badge-manager">Руководитель</span>
        </div>
        ${mgr.division ? `<div class="emp-list-role">${mgr.division}</div>` : ''}
      </div>
    </div>`;
}

function openTeamPanel(id, backFn) {
  panelBack = backFn || null;
  const team = DEPT_REGISTRY[id];
  if (!team) return;
  document.getElementById('sp-title').textContent = team.name.replace(/\n/g,' ');
  const totalCount = team.count || (team.employees || []).length;
  const emps = (team.employees || []).map((e, i) => {
    const empKey = 'emp-' + id + '-' + i;
    const av = e.photo ? `<img src="${e.photo}" alt="">` : initials(e.name);
    return `
    <div class="emp-list-item" onclick="openPersonPanelWithBack('${empKey}','${id}')">
      <div class="emp-list-avatar">${av}</div>
      <div>
        <div class="emp-list-name">${e.name}</div>
        ${e.role ? `<div class="emp-list-role">${e.role}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('sp-body').innerHTML = `
    ${_backBtn()}
    ${totalCount ? `<div style="font-size:13px;color:var(--gray);margin-bottom:14px">${totalCount}&nbsp;сотрудников</div>` : ''}
    <div class="emp-list">
      ${_mgrListItem('mgr-' + id, 'team', id)}
      ${emps}
    </div>`;
  openPanel();
}

function openDivisionPanel(id, backFn) {
  panelBack = backFn || null;
  const div = DEPT_REGISTRY[id];
  if (!div) return;
  document.getElementById('sp-title').textContent = div.name.replace(/\n/g,' ');
  const totalCount = div.count || 0;
  const children = div.children || [];
  const childItems = children.map(child => {
    const childCount = child.count || (child.employees || []).length || 0;
    return `
    <div class="emp-list-item" onclick="openTeamPanelFrom('${child.id}','${id}')">
      <div class="emp-list-group-icon"><svg width="16" height="13" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="4" r="2.5"/><path d="M1 13c0-2.5 1.8-4 4-4s4 1.5 4 4"/><circle cx="13" cy="4" r="2.5"/><path d="M17 13c0-2.5-1.8-4-4-4"/><line x1="10" y1="13" x2="8" y2="13"/></svg></div>
      <div style="flex:1">
        <div class="emp-list-name">${child.name.replace(/\n/g,' ')}</div>
        ${childCount ? `<div class="emp-list-role">${childCount}&nbsp;сотрудников</div>` : ''}
      </div>
      <svg class="emp-list-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 2l5 5-5 5"/></svg>
    </div>`;
  }).join('');
  document.getElementById('sp-body').innerHTML = `
    ${_backBtn()}
    ${totalCount ? `<div style="font-size:13px;color:var(--gray);margin-bottom:14px">${totalCount}&nbsp;сотрудников</div>` : ''}
    <div class="emp-list">
      ${_mgrListItem('mgr-' + id, 'div', id)}
      ${childItems}
    </div>`;
  openPanel();
}

function openTeamPanelFrom(teamId, divId) {
  openTeamPanel(teamId, () => openDivisionPanel(divId));
}

function openPersonPanelFromDiv(personKey, divId) {
  openPersonPanel(personKey, () => openDivisionPanel(divId));
}

let V2_PERSON_REG    = {};

function buildV2Registries(data) {
  V2_PERSON_REG     = {};
  V2_DEPT_REG       = {};
  V2_CRUMB_MAP      = {};
  V2_DEPT_CRUMB_MAP = {};
  V2_PERSON_LEADS   = {};
  V2_DEPT_HEAD_MAP  = {};

  const blockCrumb = [{ label: data.blockName, type: 'block', data }];
  const deptLabel  = id => (V2_DEPT_REG[id] ? (V2_DEPT_REG[id].name || '').replace(/\n/g,' ') : '');

  function regDeptModal(modal, deptCrumbs) {
    const crumbs = deptCrumbs || blockCrumb;
    (modal.assistants || []).forEach(a => { if (a && a.id) { V2_PERSON_REG[a.id] = a; if (!V2_CRUMB_MAP[a.id]) V2_CRUMB_MAP[a.id] = crumbs; } });
    (modal.deputies   || []).forEach(d => { if (d && d.id) { V2_PERSON_REG[d.id] = d; if (!V2_CRUMB_MAP[d.id]) V2_CRUMB_MAP[d.id] = crumbs; } });
    (modal.team       || []).forEach(t => { if (t && t.id) { V2_PERSON_REG[t.id] = t; if (!V2_CRUMB_MAP[t.id]) V2_CRUMB_MAP[t.id] = crumbs; } });
  }

  function addLeads(personId, deptIds) {
    if (!deptIds || !deptIds.length) return;
    const cur = V2_PERSON_LEADS[personId] || [];
    V2_PERSON_LEADS[personId] = [...new Set([...cur, ...deptIds])];
  }

  function regPersonWithDept(p, personCrumbs) {
    V2_PERSON_REG[p.id] = p;
    if (!V2_CRUMB_MAP[p.id]) V2_CRUMB_MAP[p.id] = personCrumbs || blockCrumb;
    // Поле leads: [] в данных персоны — явный список от 1С (работает без доп. обработки)
    if (p.leads && p.leads.length) addLeads(p.id, p.leads);
    if (p.dept && p.dept.id && p.dept.modal) {
      V2_DEPT_REG[p.dept.id] = Object.assign({ name: p.dept.name }, p.dept.modal);
      if (!V2_DEPT_CRUMB_MAP[p.dept.id]) V2_DEPT_CRUMB_MAP[p.dept.id] = personCrumbs || blockCrumb;
      V2_DEPT_HEAD_MAP[p.dept.id] = p.id;  // кто держит карточку на доске
      addLeads(p.id, [p.dept.id]);
      const deptCrumbs = [...(personCrumbs || blockCrumb), { label: (p.dept.name || '').replace(/\n/g,' '), type: 'dept', id: p.dept.id }];
      regDeptModal(p.dept.modal, deptCrumbs);
      (p.dept.modal.subdepts || []).forEach(sd => {
        if (sd.id && sd.modal) {
          V2_DEPT_REG[sd.id] = Object.assign({ name: sd.name }, sd.modal);
          if (!V2_DEPT_CRUMB_MAP[sd.id]) V2_DEPT_CRUMB_MAP[sd.id] = deptCrumbs;
          // для subdept голова — первый manager в их modal
          const sdHead0 = (sd.modal.managers || [])[0];
          if (sdHead0 && sdHead0.id) V2_DEPT_HEAD_MAP[sd.id] = sdHead0.id;
          regDeptModal(sd.modal, [...deptCrumbs, { label: (sd.name || '').replace(/\n/g,' '), type: 'dept', id: sd.id }]);
        }
      });
    }
  }

  (data.heads         || []).forEach(h => regPersonWithDept(h, blockCrumb));
  (data.blockDeputies || []).forEach(h => regPersonWithDept(h, blockCrumb));
  (data.headsDepts    || []).forEach(d => {
    if (d.person && d.person.id) { V2_PERSON_REG[d.person.id] = d.person; if (!V2_CRUMB_MAP[d.person.id]) V2_CRUMB_MAP[d.person.id] = blockCrumb; }
  });

  (data.persons || []).forEach(p => {
    regPersonWithDept(p, blockCrumb);
    const personCrumb = [...blockCrumb, { label: p.fullName || p.name, type: 'person', id: p.id }];

    (p.nested || []).forEach(n => {
      regPersonWithDept(n, personCrumb); // nested persons — с person-крошкой p

      // children of nested: crumbs = [block, p(person), n.dept]
      const nDeptC = n.dept && n.dept.id ? { label: (n.dept.name || '').replace(/\n/g,' '), type: 'dept', id: n.dept.id } : null;
      const nChildCrumbs = nDeptC ? [...personCrumb, nDeptC] : personCrumb;
      (n.children || []).forEach(c => {
        regPersonWithDept(c, nChildCrumbs);
      });

      // childBlock: p(person) → n.dept → cb.head(person) = 2 уровня иерархии
      if (n.childBlock) {
        const cb = n.childBlock;
        const cbPersonC = { label: cb.head.fullName || cb.head.name, type: 'person', id: cb.head.id };
        const cbBaseCrumbs = [...nChildCrumbs, cbPersonC]; // [block, p, n.dept, cb.head]
        if (cb.head && cb.head.id) {
          V2_PERSON_REG[cb.head.id] = cb.head;
          if (!V2_CRUMB_MAP[cb.head.id]) V2_CRUMB_MAP[cb.head.id] = nChildCrumbs; // cb.head modal: [block, p, n.dept]
          // head childBlock'а автоматически возглавляет все отделы блока
          addLeads(cb.head.id, (cb.depts || []).filter(d => d.deptId).map(d => d.deptId));
        }
        (cb.depts || []).forEach(d => {
          if (d.person && d.person.id) { V2_PERSON_REG[d.person.id] = d.person; if (!V2_CRUMB_MAP[d.person.id]) V2_CRUMB_MAP[d.person.id] = cbBaseCrumbs; }
          if (d.deptId && d.deptModal) {
            V2_DEPT_REG[d.deptId] = Object.assign({ name: d.deptName }, d.deptModal);
            if (!V2_DEPT_CRUMB_MAP[d.deptId]) V2_DEPT_CRUMB_MAP[d.deptId] = cbBaseCrumbs;
            if (d.person && d.person.id) V2_DEPT_HEAD_MAP[d.deptId] = d.person.id;
            const cbDeptCrumbs = [...cbBaseCrumbs, { label: d.deptName || '', type: 'dept', id: d.deptId }];
            regDeptModal(d.deptModal, cbDeptCrumbs);
            (d.children || []).forEach(c => {
              regPersonWithDept(c, cbDeptCrumbs);
            });
          }
        });
      }
    });

    // p.children: crumbs = [block, p.dept]
    const pDeptC = p.dept && p.dept.id ? { label: (p.dept.name || '').replace(/\n/g,' '), type: 'dept', id: p.dept.id } : null;
    const childCrumbs = pDeptC ? [...blockCrumb, pDeptC] : blockCrumb;
    (p.children || []).forEach(c => {
      regPersonWithDept(c, childCrumbs);
      if (c.childBlock) {
        const cDeptC = c.dept && c.dept.id ? { label: (c.dept.name || '').replace(/\n/g,' '), type: 'dept', id: c.dept.id } : null;
        const cbCrumbs = cDeptC ? [...childCrumbs, cDeptC] : childCrumbs;
        (c.childBlock.depts || []).forEach(d => {
          if (d.person && d.person.id) {
            V2_PERSON_REG[d.person.id] = d.person;
            if (!V2_CRUMB_MAP[d.person.id]) V2_CRUMB_MAP[d.person.id] = cbCrumbs;
          }
          if (d.deptId && d.deptModal) {
            V2_DEPT_REG[d.deptId] = Object.assign({ name: d.deptName }, d.deptModal);
            if (!V2_DEPT_CRUMB_MAP[d.deptId]) V2_DEPT_CRUMB_MAP[d.deptId] = cbCrumbs;
            if (d.person && d.person.id) { V2_DEPT_HEAD_MAP[d.deptId] = d.person.id; addLeads(d.person.id, [d.deptId]); }
          }
        });
      }
    });
  });
}

// Wire person card click (top body area)
function v2WirePersonClick(el, personData, blockData, parentDeptId) {
  if (!personData || !personData.id || personData.vacant) return;   // без руководителя — открывать некого
  const body = el.querySelector('.card-v2__body') || el.querySelector('.card-v2-nested__header');
  if (!body) return;
  body.style.cursor = 'pointer';
  const handler = (e) => {
    e.stopPropagation();
    const crumbs = [{ label: blockData ? blockData.blockName : '', type: 'block', data: blockData }];
    if (parentDeptId && V2_DEPT_REG[parentDeptId]) {
      crumbs.push({ label: V2_DEPT_REG[parentDeptId].name, type: 'dept', id: parentDeptId });
    }
    openV2PersonModal(personData.id, crumbs);
  };
  body.addEventListener('click', handler);
  const textBody = el.querySelector('.card-v2-mh__body');
  if (textBody) { textBody.style.cursor = 'pointer'; textBody.addEventListener('click', handler); }
}

/* ---- Avatar helpers ---- */
function vmAvaHtml(name, photo, size) {
  if (photo) return `<div class="vm-ava"><img src="${photo}" alt=""></div>`;
  const ini = name ? name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() : '?';
  return `<div class="vm-ava" style="background:${avatarColor(name||'')}"><span class="vm-ava-ini">${ini}</span></div>`;
}

function vmHeroAvaHtml(name, photo) {
  if (photo) return `<div class="vm-hero-ava" style="cursor:pointer" onclick="showPhotoZoom('${photo}')"><img src="${photo}" alt=""></div>`;
  const ini = name ? name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() : '?';
  return `<div class="vm-hero-ava" style="background:${avatarColor(name||'')}"><span class="vm-hero-ini">${ini}</span></div>`;
}

/* ---- Core open/close ---- */
let V2_BLOCK_DATA = null;   // current block data for breadcrumb navigation

function openV2BlockModal(blockData) {
  closePanel();
  V2_BLOCK_DATA = blockData;
  buildV2Registries(blockData);
  document.getElementById('vm-title').textContent = blockData.blockName;
  document.getElementById('vm-breadcrumbs').innerHTML = '';
  document.getElementById('vm-inner').innerHTML = renderV2BlockContent(blockData);
  bindV2BlockEvents(blockData);
  document.getElementById('v2-modal').classList.add('open');
  document.getElementById('vm-inner').parentElement.scrollTop = 0;
}

function openV2DeptModal(deptId, breadcrumbs) {
  closePanel();
  const dept = V2_DEPT_REG[deptId];
  if (!dept) return;
  // Если крошки не переданы — берём из реестра (железный fallback)
  const crumbs = (breadcrumbs != null) ? breadcrumbs : (V2_DEPT_CRUMB_MAP[deptId] || []);
  document.getElementById('vm-title').textContent = dept.name;
  renderV2Breadcrumbs(crumbs, { label: dept.name });
  document.getElementById('vm-inner').innerHTML = renderV2DeptContent(dept, deptId, crumbs);
  bindV2DeptEvents(dept, deptId, crumbs);
  document.getElementById('v2-modal').classList.add('open');
  document.getElementById('vm-inner').parentElement.scrollTop = 0;
}

function openV2PersonModal(personId, breadcrumbs) {
  closePanel();
  const p = V2_PERSON_REG[personId];
  if (!p) return;
  // Если крошки не переданы — берём из реестра (железный fallback)
  const crumbs = (breadcrumbs != null) ? breadcrumbs : (V2_CRUMB_MAP[personId] || []);
  const displayName = p.fullName || p.name;
  document.getElementById('vm-title').textContent = 'Сотрудник';
  renderV2Breadcrumbs(crumbs, { label: displayName });
  document.getElementById('vm-inner').innerHTML = renderV2PersonContent(p, crumbs);
  bindV2PersonEvents(p, crumbs);
  document.getElementById('v2-modal').classList.add('open');
  document.getElementById('vm-inner').parentElement.scrollTop = 0;
}

function closeV2Modal() {
  document.getElementById('v2-modal').classList.remove('open');
}

/* ---- Breadcrumbs ---- */
function renderV2Breadcrumbs(crumbs, current) {
  const el = document.getElementById('vm-breadcrumbs');
  if (!crumbs || !crumbs.length) { el.innerHTML = ''; return; }
  const arrow = `<svg class="vm-crumb-arrow" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 2.5L7.5 6L4.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const makeCrumb = (c, i, withArrow) =>
    `<span class="vm-crumb clickable" data-crumb-idx="${i}"><span class="vm-crumb-text">${escHtml(c.label)}</span>${withArrow ? arrow : ''}</span>`;

  let html = '';
  if (crumbs.length <= 2) {
    html = crumbs.map((c, i) => makeCrumb(c, i, i < crumbs.length - 1)).join('');
  } else {
    const middle = crumbs.slice(1, crumbs.length - 1);
    const dropItems = middle.map((c, mi) => {
      const realIdx = mi + 1;
      return `<div class="vm-crumb-drop-item" data-crumb-idx="${realIdx}">${escHtml(c.label)}</div>`;
    }).join('');
    html = makeCrumb(crumbs[0], 0, true)
      + `<span class="vm-crumb-ellipsis">
           <span class="vm-crumb-ellipsis-btn">···</span>${arrow}
           <div class="vm-crumb-ellipsis-drop" id="vm-crumb-drop">${dropItems}</div>
         </span>`
      + makeCrumb(crumbs[crumbs.length - 1], crumbs.length - 1, false);
  }
  el.innerHTML = html;

  const navigate = (idx) => {
    const crumb = crumbs[idx];
    if (crumb.type === 'block' && crumb.data) openV2BlockModal(crumb.data);
    else if (crumb.type === 'dept' && crumb.id) openV2DeptModal(crumb.id, crumbs.slice(0, idx));
    else if (crumb.type === 'person' && crumb.id) openV2PersonModal(crumb.id, crumbs.slice(0, idx));
  };
  el.querySelectorAll('.vm-crumb.clickable').forEach(node => {
    node.addEventListener('click', () => navigate(parseInt(node.dataset.crumbIdx, 10)));
  });
  const ellipsis = el.querySelector('.vm-crumb-ellipsis');
  if (ellipsis) {
    const drop = ellipsis.querySelector('.vm-crumb-ellipsis-drop');
    ellipsis.querySelector('.vm-crumb-ellipsis-btn').addEventListener('click', e => {
      e.stopPropagation(); drop.classList.toggle('open');
    });
    drop.querySelectorAll('.vm-crumb-drop-item').forEach(item => {
      item.addEventListener('click', () => navigate(parseInt(item.dataset.crumbIdx, 10)));
    });
    document.addEventListener('click', () => drop.classList.remove('open'), { capture: false });
  }
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ====================================================================
   ROW HELPERS (shared across all modals)
==================================================================== */
// Строка «также возглавляет / возглавляет» для руководителей и заместителей
function vmAlsoHtml(person, label = 'Также возглавляет') {
  const links = (person.leadsAlso || []).map(aid => {
    const ad = V2_DEPT_REG[aid];
    return ad ? `<span class="vm-row-also-link" data-dept-id="${aid}">${escHtml(ad.name.replace(/\n/g,' '))}</span>` : '';
  }).filter(Boolean);
  return links.length ? `<div class="vm-row-also">${label}: ${links.join(', ')}</div>` : '';
}

// Универсальная строка персоны с булевыми флагами контента
function vmPersonRow(p, { arrow = false, alsoLabel = '', extra = '' } = {}) {
  const alsoHtml = alsoLabel ? vmAlsoHtml(p, alsoLabel) : '';
  return `<div class="vm-row" data-person-id="${p.id}">
    ${vmAvaHtml(p.name, p.photo)}
    <div class="vm-row-info">
      <div class="vm-row-name">${escHtml(p.fullName || p.name)}</div>
      <div class="vm-row-role">${escHtml((p.role || '').replace(/\n/g,' / '))}</div>
      ${alsoHtml}${extra}
    </div>
    ${arrow ? `<span class="vm-row-arrow">${SVG_ARROW}</span>` : ''}
  </div>`;
}

/* ====================================================================
   RENDER: BLOCK MODAL
==================================================================== */
function renderV2BlockContent(data) {
  let html = '';

  // Description
  if (data.description) {
    html += `<div class="vm-desc">
      <p class="vm-desc-text" id="vm-desc-text">${escHtml(data.description)}</p>
      <button class="vm-desc-more" id="vm-desc-more">${SVG_CHEVRON_DOWN} Подробнее</button>
    </div>`;
  }

  // Управление
  const heads = data.heads || [];
  html += `<div class="vm-section">
    <div class="vm-section-title">Управление</div>`;
  if (heads.length) {
    heads.forEach(h => { html += vmPersonRow(h); });
  } else {
    html += `<div class="vm-no-manager">Без руководителя</div>`;
  }
  html += '</div>';

  // Заместители без отдела
  const deps = data.blockDeputies || [];
  if (deps.length) {
    html += `<div class="vm-section">
      <div class="vm-section-title">Заместители без отдела</div>`;
    deps.forEach(d => { html += vmPersonRow(d); });
    html += '</div>';
  }

  // Подчинённые структуры — все уникальные отделы из persons
  const allDepts = [];
  const seenIds = new Set();
  (data.persons || []).forEach(p => {
    if (p.dept && p.dept.id && !seenIds.has(p.dept.id)) {
      seenIds.add(p.dept.id);
      allDepts.push({ id: p.dept.id, name: p.dept.name, managerName: p.fullName || p.name, managerRole: p.role });
    }
    (p.nested || []).forEach(n => {
      if (n.dept && n.dept.id && !seenIds.has(n.dept.id)) {
        seenIds.add(n.dept.id);
        allDepts.push({ id: n.dept.id, name: n.dept.name, managerName: n.fullName || n.name, managerRole: n.role });
      }
    });
  });
  if (allDepts.length) {
    html += `<div class="vm-section">
      <div class="vm-section-title">Подчинённые структуры</div>`;
    allDepts.forEach(d => {
      const mgrHtml = d.managerName ? `<div class="vm-dept-mgr"><span class="vm-dept-mgr-name">${escHtml(d.managerName)}</span>${d.managerRole ? `<span class="vm-dept-mgr-sep">•</span><span class="vm-dept-mgr-role">${escHtml(d.managerRole.replace(/\n/g,' '))}</span>` : ''}</div>` : '';
      html += `<div class="vm-row vm-row--dept" data-dept-id="${d.id}">
        <div class="vm-ava-dept">${SVG_DEPT}</div>
        <div class="vm-row-info">
          <div class="vm-row-name">${escHtml(d.name.replace(/\n/g,' '))}</div>
          ${mgrHtml}
        </div>
      </div>`;
    });
    html += '</div>';
  }

  return html;
}

function bindV2BlockEvents(data) {
  const inner = document.getElementById('vm-inner');
  const blockCrumb = [{ label: data.blockName, type: 'block', data }];

  // Description toggle
  const descMore = inner.querySelector('#vm-desc-more');
  if (descMore) {
    descMore.addEventListener('click', () => {
      const txt = inner.querySelector('#vm-desc-text');
      txt.classList.toggle('expanded');
      descMore.classList.toggle('open');
      descMore.innerHTML = txt.classList.contains('expanded')
        ? SVG_CHEVRON_DOWN + ' Свернуть'
        : SVG_CHEVRON_DOWN + ' Подробнее';
    });
  }

  // Person rows — крошки из реестра
  inner.querySelectorAll('.vm-row[data-person-id]').forEach(row => {
    row.addEventListener('click', () => openV2PersonModal(row.dataset.personId, null));
  });

  // Dept rows
  // Dept rows — крошки из реестра
  inner.querySelectorAll('.vm-row[data-dept-id]').forEach(row => {
    row.addEventListener('click', () => openV2DeptModal(row.dataset.deptId, null));
  });
}

/* ====================================================================
   RENDER: DEPT MODAL
==================================================================== */
function renderV2Wizard(breadcrumbs, currentLabel, currentSub) {
  if (!breadcrumbs || !breadcrumbs.length) return '';
  function crumbSub(crumb) {
    if (crumb.type === 'block' && crumb.data && crumb.data.heads)
      return crumb.data.heads.map(h => h.fullName || h.name).filter(Boolean).join(' • ');
    if (crumb.type === 'dept' && crumb.id && V2_DEPT_REG[crumb.id]) {
      // Показываем человека, который держит карточку этого отдела на доске (железный приоритет)
      const headId = V2_DEPT_HEAD_MAP[crumb.id];
      const head = headId ? (V2_PERSON_REG[headId] || null) : null;
      if (head) return head.fullName || head.name;
      // Fallback: первый manager в modal-данных
      return (V2_DEPT_REG[crumb.id].managers || []).map(m => m.fullName || m.name).filter(Boolean).join(' • ');
    }
    if (crumb.type === 'person' && crumb.id && V2_PERSON_REG[crumb.id])
      return (V2_PERSON_REG[crumb.id].role || '').replace(/\n/g, ' / ');
    return '';
  }
  let html = `<div class="vm-section"><div class="vm-section-title">Место в структуре</div><div class="vm-wizard">`;
  breadcrumbs.forEach((crumb, i) => {
    const sub = crumbSub(crumb);
    html += `<div class="vm-wz-step">
      <div class="vm-wz-track"><div class="vm-wz-dot"></div><div class="vm-wz-line"></div></div>
      <div class="vm-wz-text">
        <div class="vm-wz-label" data-crumb-idx="${i}">${escHtml(crumb.label)}</div>
        ${sub ? `<div class="vm-wz-sub">${escHtml(sub)}</div>` : ''}
      </div></div>`;
  });
  html += `<div class="vm-wz-step">
    <div class="vm-wz-track"><div class="vm-wz-dot active"></div></div>
    <div class="vm-wz-text">
      <div class="vm-wz-label wz-current">${escHtml(currentLabel)}</div>
      ${currentSub ? `<div class="vm-wz-role">${escHtml(currentSub)}</div>` : ''}
    </div></div>`;
  html += '</div></div>';
  return html;
}

function renderV2DeptContent(dept, deptId, breadcrumbs) {
  const blockCrumb = breadcrumbs || [];
  const deptCrumb = [...blockCrumb, { label: dept.name, type: 'dept', id: deptId }];
  let html = '';

  // Description
  if (dept.description) {
    html += `<div class="vm-desc">
      <p class="vm-desc-text" id="vm-desc-text">${escHtml(dept.description)}</p>
      <button class="vm-desc-more" id="vm-desc-more">${SVG_CHEVRON_DOWN} Подробнее</button>
    </div>`;
  }

  // Руководитель(и)
  const managers = dept.managers || [];
  html += `<div class="vm-section">
    <div class="vm-section-title">Руководитель</div>`;
  if (managers.length) {
    managers.forEach(m => { html += vmPersonRow(m, { alsoLabel: 'Также возглавляет' }); });
  } else {
    html += `<div class="vm-no-manager">Без руководителя</div>`;
  }
  html += '</div>';

  // Адм. помощники
  const asst = dept.assistants || [];
  if (asst.length) {
    html += `<div class="vm-section">
      <div class="vm-section-title">Адм. помощники</div>`;
    asst.forEach(a => { html += vmPersonRow(a); });
    html += '</div>';
  }

  // Заместители
  const deps = dept.deputies || [];
  if (deps.length) {
    html += `<div class="vm-section">
      <div class="vm-section-title">Заместители</div>`;
    deps.forEach(d => { html += vmPersonRow(d, { alsoLabel: 'Возглавляет' }); });
    html += '</div>';
  }

  // Отделы
  const subdepts = dept.subdepts || [];
  if (subdepts.length) {
    html += `<div class="vm-section">
      <div class="vm-section-title">Отделы</div>`;
    subdepts.forEach(sd => {
      const mgrName = sd.managerName || ((sd.managers || [])[0] ? ((sd.managers[0].fullName || sd.managers[0].name)) : '');
      const mgrRole = sd.managerRole || ((sd.managers || [])[0] ? (sd.managers[0].role || '') : '');
      const mgrHtml = mgrName ? `<div class="vm-dept-mgr"><span class="vm-dept-mgr-name">${escHtml(mgrName)}</span>${mgrRole ? `<span class="vm-dept-mgr-sep">•</span><span class="vm-dept-mgr-role">${escHtml(mgrRole.replace(/\n/g,' '))}</span>` : ''}</div>` : '';
      html += `<div class="vm-row vm-row--dept" data-dept-id="${sd.id}">
        <div class="vm-ava-dept">${SVG_DEPT}</div>
        <div class="vm-row-info">
          <div class="vm-row-name">${escHtml(sd.name)}</div>
          ${mgrHtml}
        </div>
      </div>`;
    });
    html += '</div>';
  }

  const deptSub = (dept.managers || []).map(m => m.fullName || m.name).filter(Boolean).join(' • ');
  html += renderV2Wizard(breadcrumbs, dept.name.replace(/\n/g,' '), deptSub);

  // Команда
  const team = dept.team || [];
  if (team.length) {
    html += `<div class="vm-section">
      <div class="vm-section-title">Команда</div>`;
    team.forEach(t => { html += vmPersonRow(t); });
    html += '</div>';
  }

  return html;
}

function bindV2DeptEvents(dept, deptId, breadcrumbs) {
  const inner = document.getElementById('vm-inner');
  const deptCrumb = [...(breadcrumbs || []), { label: dept.name, type: 'dept', id: deptId }];

  // Description toggle
  const descMore = inner.querySelector('#vm-desc-more');
  if (descMore) {
    descMore.addEventListener('click', () => {
      const txt = inner.querySelector('#vm-desc-text');
      txt.classList.toggle('expanded');
      descMore.classList.toggle('open');
      descMore.innerHTML = txt.classList.contains('expanded')
        ? SVG_CHEVRON_DOWN + ' Свернуть'
        : SVG_CHEVRON_DOWN + ' Подробнее';
    });
  }

  // Person rows
  inner.querySelectorAll('.vm-row[data-person-id]').forEach(row => {
    row.addEventListener('click', () => openV2PersonModal(row.dataset.personId, deptCrumb));
  });

  // Also-leads links (inside row text)
  inner.querySelectorAll('.vm-row-also-link[data-dept-id]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.stopPropagation();
      openV2DeptModal(link.dataset.deptId, breadcrumbs || []);
    });
  });

  // Subdept rows
  inner.querySelectorAll('.vm-row[data-dept-id]').forEach(row => {
    row.addEventListener('click', () => openV2DeptModal(row.dataset.deptId, deptCrumb));
  });

  // Wizard step clicks
  inner.querySelectorAll('.vm-wz-label[data-crumb-idx]').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const idx = parseInt(lbl.dataset.crumbIdx, 10);
      const crumb = (breadcrumbs || [])[idx];
      if (!crumb) return;
      if (crumb.type === 'block' && crumb.data) openV2BlockModal(crumb.data);
      else if (crumb.type === 'dept' && crumb.id) openV2DeptModal(crumb.id, (breadcrumbs || []).slice(0, idx));
      else if (crumb.type === 'person' && crumb.id) openV2PersonModal(crumb.id, (breadcrumbs || []).slice(0, idx));
    });
  });
}

/* ====================================================================
   RENDER: PERSON MODAL
==================================================================== */
function renderV2PersonContent(p, breadcrumbs) {
  const fullName = p.fullName || p.name;
  const role = (p.role || '').replace(/\n/g, ' / ');
  let html = '';

  // Hero
  html += `<div class="vm-hero">
    ${vmHeroAvaHtml(fullName, p.photo)}
    <div class="vm-hero-info">
      <div class="vm-hero-name">${escHtml(fullName)}</div>
      <div class="vm-hero-role">${escHtml(role)}</div>
    </div>
  </div>`;

  // Contacts
  const hasAnyContact = p.phone || p.email || p.office;
  html += `<div class="vm-section"><div class="vm-section-title">Контакты</div>`;
  if (hasAnyContact) {
    html += `<div class="vm-contacts">`;
    if (p.phone) {
      html += `<div class="vm-contact-row">
        <div class="vm-contact-label">${SVG_PHONE} Телефон</div>
        <div class="vm-contact-val">${escHtml(p.phone)}</div>
        <button class="vm-contact-copy" data-copy="${escHtml(p.phone)}" title="Копировать">${SVG_COPY}</button>
      </div>`;
    }
    if (p.email) {
      html += `<div class="vm-contact-row">
        <div class="vm-contact-label">${SVG_EMAIL} E-mail</div>
        <div class="vm-contact-val">${escHtml(p.email)}</div>
        <button class="vm-contact-copy" data-copy="${escHtml(p.email)}" title="Копировать">${SVG_COPY}</button>
      </div>`;
    }
    if (p.office) {
      html += `<div class="vm-contact-row">
        <div class="vm-contact-label">${SVG_OFFICE} Кабинет</div>
        <div class="vm-contact-val">${escHtml(p.office)}</div>
        <button class="vm-contact-copy" data-copy="${escHtml(p.office)}" title="Копировать">${SVG_COPY}</button>
      </div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="vm-contact-empty">Контакты не указаны</div>`;
  }
  html += `</div>`;

  // Возглавляет: скан managers[] (стандартный путь) + V2_PERSON_LEADS (childBlock heads, explicit leads)
  const leadsFromScan = Object.entries(V2_DEPT_REG)
    .filter(([, d]) => (d.managers || []).some(m => m.id === p.id))
    .map(([id]) => id);
  const leadsIds = [...new Set([...leadsFromScan, ...(V2_PERSON_LEADS[p.id] || [])])]
    .filter(id => V2_DEPT_REG[id]);
  if (leadsIds.length) {
    html += `<div class="vm-section"><div class="vm-section-title">Возглавляет</div>`;
    leadsIds.forEach(did => {
      const d = V2_DEPT_REG[did];
      const mgr0 = (d.managers || [])[0];
      const mgrName = mgr0 ? (mgr0.fullName || mgr0.name || '') : '';
      const mgrRole = mgr0 ? (mgr0.role || '') : '';
      const mgrHtml = mgrName ? `<div class="vm-dept-mgr"><span class="vm-dept-mgr-name">${escHtml(mgrName)}</span>${mgrRole ? `<span class="vm-dept-mgr-sep">•</span><span class="vm-dept-mgr-role">${escHtml(mgrRole.replace(/\n/g,' '))}</span>` : ''}</div>` : '';
      html += `<div class="vm-row vm-row--dept" data-dept-id="${did}">
        <div class="vm-ava-dept">${SVG_DEPT}</div>
        <div class="vm-row-info">
          <div class="vm-row-name">${escHtml(d.name.replace(/\n/g,' '))}</div>
          ${mgrHtml}
        </div>
      </div>`;
    });
    html += '</div>';
  }

  html += renderV2Wizard(breadcrumbs, fullName, role);

  return html;
}

function bindV2PersonEvents(p, breadcrumbs) {
  const inner = document.getElementById('vm-inner');

  // Copy buttons
  inner.querySelectorAll('.vm-contact-copy[data-copy]').forEach(btn => {

      navigator.clipboard.writeText(btn.dataset.copy).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M19.3345 6.62836C19.5397 6.81309 19.5564 7.12923 19.3716 7.33449L11.6341 15.9318C10.7481 16.9162 9.24822 17.0389 8.21408 16.2116L4.68766 13.3904C4.47202 13.2179 4.43706 12.9033 4.60957 12.6877C4.78207 12.472 5.09672 12.4371 5.31235 12.6096L8.83877 15.4307C9.45926 15.9271 10.3592 15.8535 10.8908 15.2629L18.6284 6.66552C18.8131 6.46027 19.1292 6.44363 19.3345 6.62836Z" fill="#4caf50"/></svg>`;
        setTimeout(() => { btn.innerHTML = orig; }, 1200);
      });
    });
  });

  // Leads dept rows — крошки из реестра (null = auto)
  inner.querySelectorAll('.vm-row[data-dept-id]').forEach(row => {
    row.addEventListener('click', () => openV2DeptModal(row.dataset.deptId, null));
  });

  // Wizard step clicks
  inner.querySelectorAll('.vm-wz-label[data-crumb-idx]').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const idx = parseInt(lbl.dataset.crumbIdx, 10);
      const crumb = breadcrumbs[idx];
      if (!crumb) return;
      if (crumb.type === 'block' && crumb.data) openV2BlockModal(crumb.data);
      else if (crumb.type === 'dept' && crumb.id) openV2DeptModal(crumb.id, breadcrumbs.slice(0, idx));
    });
  });
}

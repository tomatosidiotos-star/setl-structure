<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Структура Setl</title>
  <style>

/* ============================================================
   ШРИФТЫ
   При встраивании в Битрикс: поменять пути на абсолютные
============================================================ */
@font-face {
  font-family: 'TT Commons Pro';
  src: url('Fonts/TT_Commons_Pro_Regular.otf') format('opentype');
  font-weight: 400;
}
@font-face {
  font-family: 'TT Commons Pro';
  src: url('Fonts/TT_Commons_Pro_Bold.otf') format('opentype');
  font-weight: 700;
}
@font-face {
  font-family: 'TT Commons Pro Expanded';
  src: url('Fonts/TT_Commons_Pro_Expanded_Regular.otf') format('opentype');
  font-weight: 400;
}
@font-face {
  font-family: 'TT Commons Pro Expanded';
  src: url('Fonts/TT_Commons_Pro_Expanded_DemiBold.otf') format('opentype');
  font-weight: 600;
}
@font-face {
  font-family: 'TT Commons Pro Expanded';
  src: url('Fonts/TT_Commons_Pro_Expanded_Bold.otf') format('opentype');
  font-weight: 700;
}

/* ============================================================
   ТОКЕНЫ
============================================================ */
:root {
  --red:     #ED1C24;
  --black:   #000000;
  --gray:    #41484A;
  --surface: #F6F6F6;
  --white:   #FFFFFF;
  --border:  rgba(0,0,0,0.08);
  --r-sm:    6px;
  --r-lg:    12px;
  --f-body:  'TT Commons Pro', sans-serif;
  --f-exp:   'TT Commons Pro Expanded', sans-serif;
  --lh:      1.2;

  /* полотно структуры */
  --canvas-bg:   #E7F4FF;
  --canvas-dot:  #A1D4FF;
  --canvas-line: #83BFFC;
  --link-blue:   #3C83F6;

  /* полоса прокрутки — из setl-akademiya-ui-kit (Scrollbar, размер xs; --gray-150/300/600) */
  --scrollbar-track:       #f4f3f3;
  --scrollbar-thumb:       #dedcdc;
  --scrollbar-thumb-hover: #bdb9b8;
}

/* Маленькая полоса прокрутки (Scrollbar xs из setl-akademiya-ui-kit): 12px = полоса 4 + поля 4.
   Это вид нативного скролла, а не нарисованный — тачпад и инерция работают как обычно.
   Одна на весь сервис: класс .scroll-xs на прокручиваемой коробке */
.scroll-xs { overflow: auto; }
@supports not selector(::-webkit-scrollbar) {
  .scroll-xs { scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); scrollbar-width: thin; }
}
.scroll-xs::-webkit-scrollbar { width: 12px; height: 12px; }
.scroll-xs::-webkit-scrollbar-button { display: none; }
.scroll-xs::-webkit-scrollbar-corner { background: transparent; }
.scroll-xs::-webkit-scrollbar-track,
.scroll-xs::-webkit-scrollbar-thumb {
  border-radius: 100px; border: 4px solid transparent; background-clip: padding-box;
}
.scroll-xs::-webkit-scrollbar-track { background-color: var(--scrollbar-track); }
.scroll-xs::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); }
.scroll-xs::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--f-body);
  color: var(--black);
  background: #f6f6f6;
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
  moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   ДЕМО-МАКЕТ
   При встраивании в Битрикс: убрать .demo-layout и .sidebar-stub
============================================================ */
.demo-layout {
  display: flex;
  min-height: 100vh;
}
.sidebar-stub {
  width: 331px;
  min-height: 100vh;
  background: #F9F9F9;
  border-right: 1px solid rgba(0,0,0,0.06);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 20px;
  gap: 5px;
}
.stub-logo {
  width: 68px;
  height: 26px;
  background: var(--red);
  border-radius: 4px;
  margin-bottom: 28px;
}
.stub-nav-item {
  height: 29px;
  border-radius: var(--r-sm);
  background: rgba(0,0,0,0.045);
}
.stub-nav-item.active {
  background: rgba(237,28,36,0.09);
  position: relative;
}
.stub-nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 3px;
  border-radius: 2px;
  background: var(--red);
}
.stub-nav-group {
  margin-top: 18px;
  margin-bottom: 4px;
  height: 11px;
  width: 50%;
  background: rgba(0,0,0,0.04);
  border-radius: 3px;
}

.org-content {
  /* тянется по ширине области контента: от узких экранов до 2К (2560 − меню ≈ 2230px) */
  flex: 1 1 auto; min-width: 0; max-width: 2400px;
  padding: 0 24px;
  container-type: inline-size; container-name: org;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ============================================================
   ВЬЮХИ
============================================================ */
.view { display: none; }
.view.active { display: block; }

/* ============================================================
   ХЛЕБНЫЕ КРОШКИ
============================================================ */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 18px 0 0;
  font-size: 13px;
  color: rgba(0,0,0,0.38);
}
.bc-item {
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  padding: 3px 7px;
  border-radius: 4px;
}
.bc-item:hover { color: var(--black); background: var(--surface); }
.bc-item.current { color: var(--black); cursor: default; font-weight: 600; padding: 0; }
.bc-sep { color: rgba(0,0,0,0.18); font-size: 10px; padding: 0 2px; }

/* ============================================================
   ЗАГОЛОВОК СТРАНИЦЫ (только лендинг)
============================================================ */
.page-title {
  font-family: var(--f-exp);
  font-weight: 700;
  font-size: 48px;
  color: var(--black);
  padding: 22px 0 44px;
  text-align: center;
  justify-content: center;
}

/* ============================================================
   БЭК-ОФИС: STICKY ПОЛОСКА
============================================================ */
.backoffice-strip {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  display: flex;
  align-items: center;
  gap: 14px;
}
.bo-strip-label {
  font-family: var(--f-exp);
  font-weight: 600;
  font-size: 10px;
  color: rgba(0,0,0,0.3);
  letter-spacing: 0.9px;
  white-space: nowrap;
  text-transform: uppercase;
}
.bo-strip-items { display: flex; gap: 8px; flex-wrap: nowrap; flex: 1 0 0; }
.bo-strip-item {
  padding: 0 16px;
  height: 48px;
  background: #f6f6f6;
  border-radius: 12px;
  font-family: var(--f-exp);
  font-size: 14px;
  color: var(--black);
  cursor: pointer;
  white-space: nowrap;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.bo-strip-item:hover { background: #e0e0e0; }

/* ============================================================
   ЛЕНДИНГ: ОБЩИЙ КОНТЕЙНЕР
============================================================ */
#view-landing {
  background: #f6f6f6;
  padding: 0;
  flex-direction: column;
  gap: 16px;
  min-height: 100%;
  box-sizing: border-box;
}
#view-landing.active {
  display: flex;
}
#view-tree {
  background: #ffffff;
  min-height: 100vh;
  margin: 0 -24px;
  padding: 0 24px;
}
.org-content:has(#view-tree.active) {
  background: #ffffff;
}


/* Заголовок + поиск */
.lnd-header {
  background: white;
  border-radius: 20px;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.lnd-label { font-size: 14px; color: var(--red); line-height: 1.2; margin-bottom: 6px; }
.lnd-title { font-family: var(--f-exp); font-weight: 600; font-size: 40px; color: var(--black); line-height: 1.2; }
.lnd-header__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.btn-legal.lnd-custom-btn { flex-shrink: 0; margin-top: 4px; font-family: var(--f-exp); background: #e2221c; color: #fff; }   /* праймари; .btn-legal ниже по файлу — поэтому двойной класс */
.btn-legal.lnd-custom-btn:hover { background: #c81d18; color: #fff; }
.lnd-search-block { display: flex; flex-direction: column; gap: 8px; }
.lnd-search-label { font-size: 14px; color: #7c7c7c; line-height: 1.2; }
.lnd-search-wrap {
  background: #f6f6f6; border-radius: 12px; height: 56px;
  display: flex; align-items: center; padding: 0 20px; gap: 12px;
  position: relative;
}
.lnd-search-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--f-exp); font-size: 15px; color: var(--black);
}
.lnd-search-input::placeholder { color: #7c7c7c; }
.lnd-search-icon { flex-shrink: 0; }
#search-dd-landing {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; width: auto;
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  z-index: 200; max-height: 400px; overflow-y: auto; display: none;
}
#search-dd-landing.open { display: block; }
.gs-dd-inner { display: contents; }
.gs-group-head {
  padding: 10px 16px 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  color: rgba(0,0,0,0.42); text-transform: uppercase;
  border-top: 1px solid var(--border);
}
.gs-group-head:first-child { border-top: none; }
.gs-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.gs-item:last-child { border-bottom: none; }
.gs-item:hover { background: var(--surface); }
.gs-ava-wrap { flex-shrink: 0; }
.gs-ava {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-exp); font-weight: 600; font-size: 13px; color: #333;
}
.gs-ava-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
.gs-ava-dept { background: #f6f6f6; }
.gs-info { flex: 1; min-width: 0; }
.gs-name { font-size: 13px; font-weight: 600; color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs-sub { font-size: 11px; color: rgba(0,0,0,0.42); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs-dot { opacity: 0.5; margin: 0 3px; }

/* Директора */
.lnd-directors {
  background: white; border-radius: 12px; padding: 24px;
  display: flex; gap: 0; align-items: center;
}
.lnd-dir-card {
  flex: 1; min-width: 0; padding: 0 16px; cursor: pointer;
  container-type: inline-size;
}
.lnd-dir-card__in { display: flex; gap: 16px; align-items: center; }
/* узкая карточка — текст под фото */
@container (max-width: 380px) {
  .lnd-dir-card__in { flex-direction: column; align-items: flex-start; gap: 12px; }
}
.lnd-dir-card:first-child { padding-left: 0; }
.lnd-dir-card:last-child { padding-right: 0; }
.lnd-dir-photo {
  width: 96px; height: 96px; border-radius: 12px; flex-shrink: 0;
  object-fit: cover; background: #e9e9e9;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-exp); font-weight: 600; font-size: 22px; color: #7c7c7c;
}
.lnd-dir-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.lnd-dir-info { display: flex; flex-direction: column; gap: 6px; }
.lnd-dir-name {
  font-family: var(--f-exp); font-weight: 600; font-size: 18px;
  color: var(--black); line-height: 1.2; transition: color 0.15s;
}
.lnd-dir-card:hover .lnd-dir-name { color: var(--red); }
.lnd-dir-role { font-size: 13px; color: #7c7c7c; line-height: 1.2; }

/* Бэк-офис */
.lnd-bo-row {
  background: white; border-radius: 12px; padding: 16px;
  display: flex; gap: 24px; align-items: center;
}
.lnd-bo-item {
  flex: 1; display: flex; flex-direction: column; gap: 10px;
  align-items: center; justify-content: center;
  padding: 12px 8px; border-radius: 12px; background: #f6f6f6;
  cursor: pointer; transition: background 0.15s; position: relative;
}
.lnd-bo-item:hover { background: white; box-shadow: 0 0 0 1.5px rgba(226,34,28,0.25); }
.lnd-bo-icon-wrap {
  background: white; border-radius: 10px; padding: 10px;
  display: flex; align-items: center; justify-content: center;
  line-height: 0; color: #7c7c7c; transition: color 0.15s;
}
.lnd-bo-item:hover .lnd-bo-icon-wrap { background: #fff0f0; color: var(--red); }
.lnd-bo-name { font-family: var(--f-exp); font-size: 13px; color: var(--black); text-align: center; line-height: 1.2; }

/* Компании */
.lnd-companies { display: flex; gap: 16px; }
.lnd-co-card {
  flex: 1; background: white; border-radius: 12px;
  min-height: 220px; padding: 24px; overflow: hidden;
  cursor: pointer; display: flex; flex-direction: column;
  transition: box-shadow 0.2s;
  position: relative;
}
.lnd-co-card:hover { box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
.lnd-co-card.lnd-co-card--static { cursor: default; }
.lnd-co-card.lnd-co-card--static:hover { box-shadow: none; }
.lnd-co-card.lnd-co-card--static:hover .lnd-co-default { opacity: 1 !important; transform: translateY(0) !important; pointer-events: all !important; }

.lnd-co-default {
  display: flex; flex-direction: column; gap: 16px; flex: 1;
  transition: opacity 0.22s ease, transform 0.22s ease;
  opacity: 1; transform: translateY(0);
}
.lnd-co-logo { height: 52px; object-fit: contain; object-position: left top; }
.lnd-co-name-text {
  font-family: var(--f-exp); font-weight: 700; font-size: 20px;
  color: var(--black); line-height: 1.2;
}
.lnd-co-desc { font-size: 15px; color: #7c7c7c; line-height: 1.35; flex: 1; display: flex; align-items: flex-end; }

.lnd-co-blocks {
  display: flex; flex-direction: column; flex: 1; gap: 2px;
  position: absolute; inset: 24px 12px 24px 24px;   /* справа место под полосу прокрутки */
  overflow-y: auto; overscroll-behavior: contain;
  transition: opacity 0.22s ease, transform 0.22s ease;
  opacity: 0; transform: translateY(10px); pointer-events: none;
}
.lnd-co-card:hover .lnd-co-default {
  opacity: 0; transform: translateY(-8px); pointer-events: none;
}
.lnd-co-card:hover .lnd-co-blocks {
  opacity: 1; transform: translateY(0); pointer-events: all;
}
.lnd-co-block-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-radius: 6px;
  font-family: var(--f-exp); font-size: 14px; color: var(--black);
  cursor: pointer; transition: background 0.12s, color 0.12s;
  text-decoration: none;
}
.lnd-co-block-item:hover { background: rgba(226,34,28,0.06); color: #e2221c; }
.lnd-co-block-item svg { flex-shrink: 0; color: var(--red); }
/* Руководители при наведении (компании без блоков): карточка совета директоров, компактно.
   Размер — по ширине карточки компании */
.lnd-co-card--leaders { cursor: default; container-type: inline-size; }
.lnd-co-leaders { gap: 16px; inset: 24px; }
.lnd-dir-card--compact { padding: 0; cursor: default; flex: none; }
.lnd-dir-card--compact .lnd-dir-card__in { flex-direction: row; align-items: center; gap: 16px; }
.lnd-dir-card--compact .lnd-dir-photo { width: 72px; height: 72px; font-size: 18px; color: rgba(0,0,0,0.5); }
.lnd-dir-card--compact .lnd-dir-info { gap: 4px; min-width: 0; }
.lnd-dir-card--compact .lnd-dir-name { font-size: 16px; }
.lnd-dir-card--compact:hover .lnd-dir-name { color: var(--black); }
@container (max-width: 360px) {
  .lnd-co-leaders { gap: 12px; }
  .lnd-dir-card--compact .lnd-dir-card__in { gap: 12px; }
  .lnd-dir-card--compact .lnd-dir-photo { width: 56px; height: 56px; font-size: 15px; }
  .lnd-dir-card--compact .lnd-dir-name { font-size: 14px; }
  .lnd-dir-card--compact .lnd-dir-role { font-size: 12px; }
}
@container (max-width: 260px) {
  .lnd-dir-card--compact .lnd-dir-photo { width: 44px; height: 44px; font-size: 13px; border-radius: 10px; }
  .lnd-dir-card--compact .lnd-dir-photo img { border-radius: 10px; }
  .lnd-dir-card--compact .lnd-dir-name { font-size: 13px; }
}
/* пока список помещается — по центру по высоте; не помещается — прокрутка с начала */
.lnd-co-blocks > :first-child { margin-top: auto; }
.lnd-co-blocks > :last-child { margin-bottom: auto; }

.section-label {
  font-family: var(--f-exp);
  font-weight: 400;
  font-size: 11px;
  color: rgba(0,0,0,0.35);
  letter-spacing: 1.3px;
  text-align: center;
  margin-bottom: 20px;
  text-transform: uppercase;
}
.directors-row {
  display: flex;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin: 0 -24px;
}
.dir-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 44px 40px 40px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  gap: 0;
}
.dir-card:last-child { border-right: none; }
.dir-avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--white);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--gray);
  font-weight: 600;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
}
.dir-avatar img { width: 100%; height: 100%; object-fit: cover; }
.dir-role {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.45;
  margin-top: 18px;
  margin-bottom: 10px;
  min-height: 42px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.dir-name {
  font-family: var(--f-exp);
  font-weight: 700;
  font-size: 14px;
  color: var(--black);
  line-height: 1.45;
  transition: color 0.15s;
}
.dir-card { cursor: pointer; }
.dir-card:hover .dir-name { color: var(--red); }

/* ============================================================
   ЛЕНДИНГ: КОМПАНИИ
============================================================ */
.h-divider { height: 1px; background: var(--border); }
.companies-row { display: flex; }
.company-tile {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  transition: background 0.2s;
  position: relative;
  border-right: 1px solid var(--border);
  overflow: hidden;
  min-height: 220px;
}
.company-tile:last-child { border-right: none; }
.company-tile::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: var(--red);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.company-tile:hover { background: var(--surface); }
.company-tile.show-blocks:hover { background: var(--white); }
.company-tile:not(.show-blocks):hover::after { transform: scaleX(1); }

.company-tile__default {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 32px 52px; flex: 1;
}
.company-tile__default img { max-width: 210px; max-height: 68px; object-fit: contain; }
.company-tile-name {
  font-family: var(--f-exp);
  font-weight: 700;
  font-size: 20px;
  text-align: center;
  line-height: 1.3;
}
.company-tile-arrow {
  position: absolute;
  bottom: 20px; right: 24px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.25s;
  color: var(--red);
  transform: translateX(-6px);
}
.company-tile:not(.show-blocks):hover .company-tile-arrow { opacity: 1; transform: translateX(0); }

.company-tile__blocks {
  display: none; flex-direction: column;
  justify-content: center; flex: 1;
}
.company-tile.show-blocks .company-tile__blocks { display: flex; }
.company-tile.show-blocks .company-tile__default { display: none; }
.company-tile__block-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px;
  font-family: var(--f-exp); font-size: 14px; font-weight: 500;
  color: var(--black);
  border-bottom: 1px solid var(--border);
  transition: color 0.13s;
  cursor: pointer;
}
.company-tile__block-item:last-child { border-bottom: none; }
.company-tile__block-item:hover { color: var(--red); }
.company-tile__block-item svg { flex-shrink: 0; color: var(--red); }

/* ============================================================
   ЛЕНДИНГ: БЭК-ОФИС (полный)
============================================================ */
.backoffice-full { padding: 48px 0 72px; }
.bo-full-grid {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}
.bo-full-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 18px 20px 14px;
  border-radius: var(--r-lg);
  background: var(--surface);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  color: var(--gray);
  min-width: 104px;
  text-align: center;
}
.bo-full-item:hover { background: var(--white); color: var(--black); box-shadow: 0 0 0 1px var(--border); }
.bo-full-item:hover .bo-icon { color: rgba(0,0,0,0.4); }
.bo-icon { color: rgba(0,0,0,0.4); transition: color 0.15s; line-height: 0; }
.bo-full-name { font-family: var(--f-exp); font-weight: 600; font-size: 13px; }

/* ============================================================
   COMPANY VIEW
============================================================ */
.cv-header {
  padding: 32px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cv-logo-area { display: flex; align-items: center; gap: 18px; }
.cv-logo-area img { max-height: 48px; object-fit: contain; }
.cv-logo-name { font-family: var(--f-exp); font-weight: 700; font-size: 24px; }
.cv-red-line { width: 1px; height: 36px; background: #C8C8C8; }
.btn-legal {
  display: inline-flex; align-items: center;
  background: #fdf0f0; color: #d33831;
  border: none; cursor: pointer;
  padding: 0 16px; height: 30px; border-radius: 6px;
  font-family: var(--f-body); font-size: 14px;
  white-space: nowrap; transition: background 0.15s, color 0.15s;
}
.btn-legal:hover { background: #fad8d8; color: #c0302a; }
.btn-legal svg { margin-right: 6px; }

.blocks-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  margin-top: 32px;
  padding-bottom: 60px;
}
.block-tile {
  padding: 32px 24px 28px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 28px;
  transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  position: relative;
  overflow: hidden;
  min-height: 160px;
}
.block-tile::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--red);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.block-tile:hover {
  box-shadow: 0 8px 36px rgba(0,0,0,0.09);
  border-color: transparent;
  transform: translateY(-3px);
}
.block-tile:hover::before { transform: scaleX(1); }
.block-name {
  font-family: var(--f-exp);
  font-weight: 700;
  font-size: 15px;
  color: var(--black);
  line-height: 1.35;
}
.block-arrow {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gray);
  transition: background 0.2s, color 0.2s;
  flex-shrink: 0;
  align-self: flex-start;
}
.block-tile:hover .block-arrow { background: var(--red); color: var(--white); }

/* ============================================================
   TREE VIEW
============================================================ */
/* Шапка блока */
.tv-head {
  display: flex; gap: 24px; align-items: center;
  padding: 36px 0 12px;
}
.tv-head__main, .tv-head__desc { flex: 1 1 0; min-width: 0; }
.tv-head__main { display: flex; gap: 16px; align-items: flex-start; }
/* Кнопка-иконка (розовая, как «назад» у названия блока): обычная — 30px, XS — 24px */
.btn-icon {
  width: 30px; height: 30px; flex-shrink: 0; padding: 0;
  display: grid; place-items: center;
  background: #fdf0f0; border: none; border-radius: 6px; cursor: pointer;
  transition: background 0.15s;
}
.btn-icon:hover { background: #fad8d8; }
.btn-icon img { display: block; width: 14px; height: 14px; }
.btn-icon--xs { width: 24px; height: 24px; }
.btn-icon--xs img { width: 12px; height: 12px; }
.btn-icon__flip { transform: scaleX(-1); }   /* стрелка вправо — та же «влево», отражённая */
.tv-back { margin-top: 6px; }
.tv-head__titles { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tv-title {
  font-family: var(--f-exp); font-weight: 600; font-size: 32px; line-height: 1.2;
  color: var(--black);
}
.tv-head__actions { display: flex; gap: 4px; flex-wrap: wrap; }
.tv-head .btn-legal { font-family: var(--f-exp); color: #e2221c; }
/* «Список юридических лиц» — ссылкой, как «Подробнее» */
.tv-link {
  height: 30px; padding: 4px 0; background: none; border: none; cursor: pointer;
  font-family: var(--f-exp); font-size: 14px; line-height: 1.2; color: #d33831;
}
.tv-link:hover { opacity: 0.75; }
#btn-print-open svg { display: block; }
.tv-head__desc { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.tv-desc {
  max-width: 700px;
  font-family: var(--f-exp); font-size: 16px; line-height: 1.2; color: #7c7c7c;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.btn-more {
  height: 30px; padding: 4px 0;
  background: none; border: none; cursor: pointer;
  font-family: var(--f-exp); font-size: 14px; line-height: 1.2; color: #d33831;
}
.btn-more:hover { opacity: 0.75; }
.tv-controls-row {
  display: flex; align-items: center; gap: 32px;
  margin: 24px -24px 0; padding: 8px 24px;
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.tv-controls { display: flex; align-items: center; gap: 32px; flex-shrink: 0; }
.tv-controls .search-wrap { flex: none; width: 280px; }
/* Пока шапка в две колонки — поиск+масштаб занимают правую половину, и поиск начинается
   по левому краю описания (половины шапки: (ширина − зазор 24) / 2) */
@container org (min-width: 1151px) {
  .tv-controls { flex: 0 0 calc((100% - 24px) / 2); }
  .tv-controls .search-wrap { flex: 1 1 auto; width: auto; }
}
.tv-controls-row .bo-strip-items { gap: 16px; }

/* Лента иконок с прокруткой стрелками (setupHScroll) */
.hscroll { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
.hscroll .bo-strip-items {
  flex: 1 1 auto; min-width: 0; overflow-x: auto; scroll-behavior: smooth;
  scrollbar-width: none; overscroll-behavior-x: contain;
}
.hscroll .bo-strip-items::-webkit-scrollbar { display: none; }
.hscroll::before, .hscroll::after {        /* затухание у края, где есть продолжение */
  content: ''; position: absolute; top: 0; bottom: 0; width: 56px; z-index: 1;
  pointer-events: none; opacity: 0; transition: opacity 0.2s;
}
.hscroll::before { left: 0;  background: linear-gradient(to right, #fff 40%, rgba(255,255,255,0)); }
.hscroll::after  { right: 0; background: linear-gradient(to left,  #fff 40%, rgba(255,255,255,0)); }
.hscroll.can-prev::before, .hscroll.can-next::after { opacity: 1; }
.hscroll__btn {          /* вид — .btn-icon--xs, здесь только место и появление */
  position: absolute; top: 50%; z-index: 2; transform: translateY(-50%);
  opacity: 0; pointer-events: none; transition: opacity 0.2s, background 0.15s;
}
.hscroll__btn--prev { left: 0; }
.hscroll__btn--next { right: 0; }
.hscroll.can-prev .hscroll__btn--prev, .hscroll.can-next .hscroll__btn--next { opacity: 1; pointer-events: auto; }

/* Иконки бэк-офиса (вместо текстовых пилюль), подпись — в тултипе */
.bo-strip-item--icon { width: 36px; height: 36px; padding: 0; }
.bo-strip-item--icon svg, .bo-strip-item--icon img { width: 20px; height: 20px; display: block; }

/* Адаптив экрана дерева (по ширине контентной области .org-content):
   — описание с «Подробнее» уходит под название и кнопки;
   — поиск и масштаб уходят под иконки бэк-офиса;
   — полотно уменьшается пропорционально (aspect-ratio у .canvas-wrapper) */
@container org (max-width: 1150px) {
  .tv-head { flex-direction: column; align-items: stretch; gap: 12px; }
  .tv-head__desc { padding-left: 46px; }   /* по левому краю названия: «назад» 30 + отступ 16 */
}
@container org (max-width: 1000px) {
  .tv-controls-row { flex-wrap: wrap; row-gap: 12px; }
  .tv-controls { width: 100%; }
  .tv-controls .search-wrap { flex: 1 1 auto; width: auto; }
}
.zoom-right { display: flex; align-items: center; gap: 24px; flex-shrink: 0; }
.zoom-group { display: flex; align-items: center; gap: 8px; }

.search-wrap { position: relative; flex: 1 0 0; }
.search-input {
  width: 100%;
  height: 36px;
  padding: 0 40px 0 12px;
  border: none;
  border-radius: 12px;
  font-family: var(--f-exp);
  font-size: 16px; letter-spacing: 0.02em;
  outline: none;
  background: #f6f6f6;
  color: var(--black);
  transition: background 0.15s;
}
.search-input:focus { background: #eeeeee; }
.search-input::placeholder { color: #7c7c7c; }
.search-icon {
  position: absolute;
  right: 14px;
  left: auto;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(0,0,0,0.32);
  pointer-events: none;
}
/* Крестик сброса — вместо лупы, когда в поле что-то введено */
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: none; border-radius: 6px; background: none;
  display: none; place-items: center; cursor: pointer;
  color: rgba(0,0,0,0.45); transition: color 0.15s, background 0.15s;
}
.search-clear:hover { color: var(--black); background: rgba(0,0,0,0.05); }
.search-wrap.has-value .search-icon { display: none; }
.search-wrap.has-value .search-clear { display: grid; }

/* Zoom slider */
.zoom-slider {
  -webkit-appearance: none; appearance: none;
  width: 140px; height: 6px;
  border-radius: 4px; outline: none; border: none; cursor: pointer;
  background: #f6f6f6;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.22);
  cursor: pointer;
}
.zoom-slider::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%; border: none;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.22);
  cursor: pointer;
}
.search-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  width: auto;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  z-index: 200;
  max-height: 320px;
  overflow-y: auto;
  display: none;
}
.search-dropdown.open { display: block; }
.sd-item {
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.sd-item:hover { background: var(--surface); }
.sd-item:last-child { border-bottom: none; }
.sd-name { font-weight: 600; font-size: 13px; }
.sd-role { font-size: 11px; color: rgba(0,0,0,0.42); margin-top: 2px; }

.zoom-btn {
  width: 36px;
  height: 36px;
  background: #fdf0f0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.zoom-btn:hover { background: #fad8d8; }
/* «Развернуть все / Свернуть все»: иконка по режиму */
.fold-all-btn[hidden] { display: none; }
/* «Структура» (кастомная): без юрлиц, ленты отделов, поиска и «развернуть все» */
#view-tree.is-custom #btn-legal-open, #view-tree.is-custom .tv-controls-row .hscroll,
#view-tree.is-custom .tv-controls .search-wrap, #view-tree.is-custom #btn-fold-all { display: none !important; }
#view-tree.is-custom .tv-controls-row { justify-content: flex-end; }
#view-tree.is-custom .tv-controls { flex: none !important; margin-left: auto; }
.fold-all-btn, .zoom-btn--reset { margin-right: -16px; }   /* развернуть все, сброс, печать — группой с зазором 8 */
.fold-all-btn[data-mode="expand"] .fold-all-btn__collapse,
.fold-all-btn[data-mode="collapse"] .fold-all-btn__expand { display: none; }

.canvas-wrapper {
  margin-top: 8px;
  aspect-ratio: 1488 / 902;   /* по макету; на узких экранах уменьшается пропорционально */
  max-height: calc(100vh - 140px);   /* на широких (2К) не выше экрана под липкой строкой управления */
  min-height: 420px;
  background-color: var(--canvas-bg);
  background-image: radial-gradient(circle, var(--canvas-dot) 1px, transparent 1px);
  background-size: 24px 24px;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  cursor: grab;
  user-select: none;
}
.canvas-wrapper.panning { cursor: grabbing; }
.canvas-inner {
  position: absolute;
  transform-origin: 0 0;
}
.tree-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
}

/* ============================================================
   КАРТОЧКИ ДЕРЕВА
============================================================ */
.tree-node { position: absolute; }

/* Кнопка сворачивания ветки — по центру нижнего края карточки */
.fold-btn {
  position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); z-index: 2;
  height: 24px; min-width: 24px; padding: 0 6px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
  background: #fff; border: 1px solid #CFE6FD; color: var(--link-blue);
  font-family: var(--f-exp); font-weight: 600; font-size: 11px; line-height: 1;
  box-shadow: 0 2px 8px rgba(23,137,190,0.18); cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.fold-btn svg { transform: rotate(180deg); }
.fold-btn--folded { padding: 0 6px 0 9px; }
.fold-btn--corner { left: auto; right: 24px; transform: none; }
.fold-btn--folded svg { transform: none; }
.fold-btn:hover { background: #E8F0FE; border-color: var(--link-blue); }
/* боковая — по центру правого края наборной карточки */
.fold-btn--side { left: auto; bottom: auto; right: 0; top: 50%; transform: translate(50%, -50%); }
.fold-btn--side svg { transform: rotate(90deg); }
.fold-btn--side.fold-btn--folded svg { transform: rotate(-90deg); }

/* Группа топ-руководителей */
.group-heads-box {
  display: flex;
  gap: 28px;
  background: transparent;
  border: none;
  padding: 0;
  box-shadow: none;
}
/* Подложка — включается когда руководителей > 1 */
.group-heads-box--plate {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  padding: 12px;
}

/* Карточка топ-руководителя */
.card-head {
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--r-lg);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  width: 148px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s, border-color 0.2s;
  cursor: pointer;
}
.card-head:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-color: #C8C8C8; }
.card-head-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--surface);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--gray);
  flex-shrink: 0;
}
.card-head-avatar img { width: 100%; height: 100%; object-fit: cover; }
.card-head-role { font-size: 10px; color: rgba(0,0,0,0.42); line-height: 1.4; }
.card-head-name { font-family: var(--f-exp); font-weight: 700; font-size: 11px; color: var(--black); }

/* Карточка менеджера */
.card-person {
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--r-lg);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  width: 148px;
  height: 148px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s, border-color 0.2s;
}
.card-person:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-color: #C8C8C8; }
.card-person.hl { border-color: var(--red); box-shadow: 0 0 0 3px rgba(237,28,36,0.12); }
.card-div.hl    { border-color: var(--red) !important; box-shadow: 0 0 0 3px rgba(237,28,36,0.12) !important; }
.card-head.hl   { border-color: var(--red) !important; box-shadow: 0 0 0 3px rgba(237,28,36,0.12) !important; }
.card-person-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--surface);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--gray);
}
.card-person-avatar img { width: 100%; height: 100%; object-fit: cover; }
.card-person-role { font-size: 10px; color: rgba(0,0,0,0.42); line-height: 1.4; }
.card-person-name { font-family: var(--f-exp); font-weight: 700; font-size: 10px; color: var(--black); }

/* Карточка помощника */
.card-assistant {
  position: absolute;
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--r-lg);
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  text-align: center;
  width: 108px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s, border-color 0.2s;
  cursor: pointer;
}
.card-assistant:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-color: #C8C8C8; }
.card-assistant-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
}
.card-assistant-avatar img { width: 100%; height: 100%; object-fit: cover; }
.card-assistant-role { font-size: 9px; color: rgba(0,0,0,0.38); line-height: 1.3; }
.card-assistant-name { font-family: var(--f-exp); font-weight: 600; font-size: 9px; color: var(--black); }

/* Плашка подразделения (уровни 3–4) */
.card-div {
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--r-lg);
  padding: 12px;
  width: 148px;
  height: 148px;  /* = DH constant */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: default;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s, border-color 0.2s;
}
.card-div:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-color: #C8C8C8; }
.card-div--exp { height: 111px; width: 185px; }
.cdiv-title {
  flex: 1;
  font-family: var(--f-exp);
  font-weight: 700;
  font-size: 11px;
  color: var(--black);
  line-height: 1.35;
  text-align: center;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}
.cdiv-bottom { display: flex; flex-direction: column; gap: 5px; }
.cdiv-manager-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--surface);
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
  transition: background 0.15s;
  min-width: 0;
}
.cdiv-manager-chip:hover { background: #E0E0E0; }
.cdiv-manager-avatar {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #ddd;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; font-weight: 600; color: rgba(0,0,0,0.5);
  overflow: hidden;
}
.cdiv-manager-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cdiv-manager-name {

.cdiv-emp-chip {

/* Плашка подразделения-ссылки */
.card-div-link {

/* ============================================================
   КАРТОЧКА СОТРУДНИКА НА КАНВАСЕ (expanded-режим)
============================================================ */
.card-emp-node {
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.08);

  padding: 8px 10px;

}
.card-emp-node:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); border-color: #C8C8C8; }
.card-emp-node.hl    { border-color: var(--red); box-shadow: 0 0 0 3px rgba(237,28,36,0.12); }
.card-v2.hl .card-v2__name,
.card-v2.hl .card-v2__role { color: #3C83F6 !important; }
.card-v2-multi__dept.hl { background: #E0EBFE !important; }
.card-emp-node-avatar {

  border-radius: 50%;

}
.card-emp-node-avatar img { width: 100%; height: 100%; object-fit: cover; }
.card-emp-node-info { min-width: 0; flex: 1; }
.card-emp-node-name {
  font-family: var(--f-exp); font-weight: 700; font-size: 9.5px;
  color: var(--black); line-height: 1.25;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card-emp-node-role {
  font-size: 8.5px; color: var(--gray); margin-top: 2px; line-height: 1.25;
  overflow: hidden; display: -webkit-box;

}

/* ============================================================
   БОКОВАЯ ПАНЕЛЬ: СОТРУДНИКИ КОМАНДЫ
============================================================ */
.emp-team-header {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 14px 18px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.emp-team-manager { font-size: 13px; color: var(--gray); }
.emp-team-count   { font-family: var(--f-exp); font-weight: 600; font-size: 13px; color: var(--black); }
.emp-card {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 16px 20px;
  margin-bottom: 10px;
}
.emp-name { font-family: var(--f-exp); font-weight: 700; font-size: 13px; color: var(--black); margin-bottom: 10px; }
.emp-row  { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray); margin-bottom: 6px; }
.emp-row:last-child { margin-bottom: 0; }
.emp-row svg { flex-shrink: 0; color: rgba(0,0,0,0.32); }
.emp-card-clickable { cursor: pointer; transition: background 0.15s; }
.emp-card-clickable:hover { background: #EFEFEF; }

/* ============================================================
   V2 КАРТОЧКИ (новый дизайн для демо)
============================================================ */
/* ---- Одиночная карточка: 170×196px, скошенный правый угол (папка) ---- */
.card-v2 {
  background: var(--white);
  width: 170px;
  height: 196px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-top: 14px;
  flex-shrink: 0;
  clip-path: path('M 20 0 H 150 L 170 20 V 176 C 170 187 161 196 150 196 H 20 C 9 196 0 187 0 176 V 20 C 0 9 9 0 20 0 Z');
  filter: drop-shadow(0 0 15px rgba(23,137,190,0.1));
}
.card-v2__body {
  padding: 0 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card-v2__photo {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #e0dede;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-v2__photo img { width: 100%; height: 100%; object-fit: cover; }
.card-v2__photo-initials { font-family: var(--f-exp); font-weight: 600; font-size: 8px; color: #5A5A5A; }
.card-v2__text { display: flex; flex-direction: column; gap: 2px; }
.card-v2__name { font-family: var(--f-exp); font-weight: 600; font-size: 10px; color: var(--black); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.card-v2__role { font-family: var(--f-exp); font-weight: 400; font-size: 6.75px; color: #7c7c7c; line-height: 1.2; height: 34px; overflow: hidden; }
.card-v2__dept {
  background: #f2f2f2;
  border: 1px solid var(--white);
  border-radius: 20px;
  padding: 14px;
  font-family: var(--f-exp);
  font-weight: 600;
  font-size: 10px;
  color: var(--black);
  height: 64px;
  display: flex;
  align-items: center;
  line-height: 1.2;
  overflow: hidden;
  box-sizing: border-box;
  flex-shrink: 0;
}
.card-v2__dept--link {
  box-shadow: inset 0 0 0 2px #3C83F6;
  cursor: pointer;
  transition: background 0.18s;
}
.card-v2__dept--link:hover { background: #e8f0fe; }

/* ---- Карточка-в-карточке ---- */
.card-v2-nested {
  background: var(--white);
  height: 196px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-shrink: 0;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
  filter: drop-shadow(0 0 15px rgba(23,137,190,0.1));
}
.card-v2-nested__header {
  padding: 8px 14px 0;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}
.card-v2-nested__inner {
  display: flex;
  gap: 9px;
  flex-shrink: 0;
}
.card-v2-nested .card-v2 {
  width: 170px;
  height: 144px;
  filter: none;
  clip-path: path('M 20 0 H 150 L 170 20 V 124 C 170 135 161 144 150 144 H 20 C 9 144 0 135 0 124 V 20 C 0 9 9 0 20 0 Z');
  padding-top: 14px;
}
.card-v2-nested .card-v2__dept {
  height: 52px;
}

/* ---- Мульти-голова (несколько руководителей → один общий блок) ---- */
/* ── Multi-head карточка (NameCard1 + GroupCard) ── */
.card-v2-multi {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex-shrink: 0;
  filter: drop-shadow(0 0 15px rgba(23,137,190,0.1));
}
.card-v2-multi__heads { display: flex; gap: 4px; align-items: flex-start; }

/* NameCard1: переопределяем базовую card-v2 */
.card-v2-multi .card-v2 {
  filter: none;
  clip-path: none;
  height: 132px;
  padding-top: 0;
  justify-content: flex-start;
  background: transparent;
}

/* Шапка: Wrap + Surface */
.card-v2-mh__header {
  display: flex;
  align-items: flex-start;
  flex-shrink: 0;
  width: 170px;
}
/* Wrap: аватар (+ опц. текст), flex-1, скруглён только TL */
.card-v2-mh__wrap {
  flex: 1;
  min-width: 0;
  height: 50px;
  background: white;
  border-radius: 20px 0 0 0;
  padding: 14px 0 0 14px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  box-sizing: border-box;
}
/* Surface: 52×50px SVG вогнутой кривой */
/* +1px влево и вниз — перекрывает sub-pixel зазоры на стыках */
.card-v2-mh__surface {
  width: 53px;
  height: 51px;
  margin-left: -1px;
  flex-shrink: 0;
  display: block;
  line-height: 0;
  font-size: 0;
}
.card-v2-mh__surface svg { display: block; width: 53px; height: 51px; }

/* Швы составной карточки. Карточка собрана из белых частей встык (шапка, Surface, тело,
   плашка отдела); при дробном масштабе холста на стыке получаются полупрозрачные пиксели,
   и сквозь них проступает голубая тень карточки — тонкая линия. Каждая часть подкладывает
   под соседнюю 2px белого тенью без размытия: раскладка не меняется, стык всегда непрозрачный */
.card-v2-mh__wrap, .card-v3__head-wrap { box-shadow: 2px 0 0 #fff, 0 2px 0 #fff, 2px 2px 0 #fff; }
.card-v2-mh__body { box-shadow: 0 2px 0 #fff, 0 -2px 0 #fff; }   /* вниз — к плашке отдела, вверх — под Surface */
.card-v3__cards { box-shadow: 0 -2px 0 #fff; }

/* Тело: -1px margin-top закрывает нижний зазор шапки */
.card-v2-mh__body {
  flex: 1;
  width: 170px;
  background: white;
  padding: 1px 14px 14px;
  margin-top: -1px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 0;
  box-sizing: border-box;
}
/* Текстовый блок внутри тела */
.card-v2-mh__text {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
  line-height: 1.2;
  min-height: 0;
  overflow: hidden;
}
/* Имя: не сжимается */
.card-v2-multi .card-v2__name { flex-shrink: 0; width: 100%; transition: color 0.13s; }
/* Роль: заполняет оставшееся, без фиксированной высоты */
.card-v2-multi .card-v2__role { flex: 1; height: auto; min-height: 1px; width: 100%; transition: color 0.13s; }
/* Hover по имени и роли — синий */
.card-v2-mh__body:hover .card-v2__name,
.card-v2-mh__body:hover .card-v2__role { color: #3C83F6; }
/* Отдел без руководителя */
.card-v2__photo--vacant { background: #ececec; }
.card-v2__name.card-v2__name--vacant { font-weight: 400; color: #9a9a9a; }
.card-v2--vacant .card-v2-mh__body:hover .card-v2__name { color: #9a9a9a; }
.card-v2--vacant .card-v2__body, .card-v2--vacant .card-v2-mh__body { cursor: default; }

/* GroupCard: белый внешний, h=64px, скруглён снизу */
.card-v2-multi__dept-wrap {
  background: white;
  border: 1px solid white;
  height: 64px;
  border-radius: 0 0 20px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-sizing: border-box;
}
/* GroupCard inner: серый, все углы 20px */
.card-v2-multi__dept {
  flex: 1;
  height: 100%;
  background: #f2f2f2;
  border: 1px solid white;
  border-radius: 20px;
  padding: 14px;
  font-family: var(--f-exp);
  font-weight: 600;
  font-size: 10px;
  color: var(--black);
  display: flex;
  align-items: center;
  box-sizing: border-box;
  transition: background 0.13s;
}
.card-v2-multi__dept-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  line-height: 1.2;
  word-break: break-word;
}
.card-v2-multi__dept:hover { background: #E0EBFE; }
.card-v2-multi__dept--link { box-shadow: inset 0 0 0 2px var(--link-blue); cursor: pointer; }
.card-v2-multi__dept--link:hover { background: #e8f0fe; }

/* Отдел-ссылка (ведёт в отдельное дерево): силуэт города + стрелка над названием */
.card-v2-multi__dept--link {
  flex-direction: column; align-items: stretch; justify-content: center;
  padding: 8px 14px; border: none;
}
.card-v2-multi__dept--link .card-v2-multi__dept-text { -webkit-line-clamp: 2; }
.dept-link__head { display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
.dept-link__city {
  position: relative; width: 125px; height: 18px; overflow: hidden;
  border-radius: 8px 8px 0 0; flex-shrink: 0;
}
.dept-link__city img { position: absolute; left: -17px; top: 3px; width: 142.47px; height: 76.63px; max-width: none; }
.dept-link__arrow { display: block; width: 13px; height: 13px; }

/* ===== 3й вариант: 1 руководитель + несколько отделов ===== */
.card-v3 {
  display: flex; flex-direction: column; align-items: flex-end;
  flex-shrink: 0; filter: drop-shadow(0 0 15px rgba(23,137,190,0.1));
  height: 196px;
}
/* Общий header: аватар + текст + Surface; height: 50px clips surface 51px → gap закрывается margin-top:-1px на cards */
.card-v3__header { display: flex; align-items: center; flex-shrink: 0; height: 50px; overflow: hidden; }
.card-v3__head-wrap {
  flex: 1; min-width: 0; height: 50px; background: white;
  border-radius: 20px 0 0 0; padding: 14px 0 0 14px;
  display: flex; align-items: flex-start; gap: 8px; box-sizing: border-box;
}
.card-v3__head-text {
  flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column;
  gap: 2px; height: 33px; overflow: hidden; line-height: 1.2;
}
/* Отдельные классы для имени/должности в шапке — не конфликтуют с base card-v2__name */
.card-v3__name {
  font-family: var(--f-exp); font-weight: 600; font-size: 10px; color: var(--black);
  line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex-shrink: 0; width: 100%; transition: color 0.13s;
}
/* шапка-название (блок, а не человек): название до двух строк, чтобы не обрезалось в узкой карточке */
.card-v3__head-wrap--title .card-v3__head-text { height: 36px; justify-content: flex-start; }
.card-v3__head-wrap--title .card-v3__name {
  white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-v3__head-wrap--title .card-v3__role { display: none; }

/* «Структура»: карточки только для чтения — без наведения и кликов, название группы крупнее */
#view-tree.is-custom .card-v2-multi, #view-tree.is-custom .card-v3 { pointer-events: none; }
#view-tree.is-custom .card-v3__head-wrap--title .card-v3__name { font-size: 20px; line-height: 1.1; }   /* размер подбирается в buildCustomTree */
#view-tree.is-custom .card-v3__head-wrap--title .card-v3__head-text { height: 44px; }
#view-tree.is-custom .card-v3__head-wrap--title { padding-top: 12px; }
.card-v3__role {
  font-family: var(--f-exp); font-weight: 400; font-size: 6.75px; color: #7c7c7c;
  line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-height: 1px; width: 100%; transition: color 0.13s;
}
.card-v3__head-wrap:hover .card-v3__name,
.card-v3__head-wrap:hover .card-v3__role { color: #3C83F6; }
/* Ряд под-карточек: flex: 1 → заполняет 196 - 50 = 146px */
.card-v3__cards {
  background: white; border-radius: 0 0 20px 20px;
  display: flex; gap: 4px; align-items: stretch; flex: 1; min-height: 0;
  margin-top: -1px;
}
/* Каждая под-карточка (NameCard1 + GroupCard) — растягивается на всю высоту ряда */
.card-v3__sub-heads { display: flex; gap: 4px; flex: 1; min-height: 0; }
/* Отметка зама — плашка по низу аватарки, по центру, с белой обводкой (v2PutAvatar) */
.v2-ava { position: relative; flex-shrink: 0; }
/* Замы стопкой у правого края (вариант на сравнение) */
/* от правого края карточки: отступ = видимая ширина резного края (~35px) + 10px. Шапка — белая часть
   (wrap) + Surface 53px, поэтому от края wrap это −8px: стопка заходит на белую часть Surface,
   вырез начинается правее. По высоте — по центру аватарки руководителя (14 + 30/2) */
.card-v2-mh__wrap, .card-v3__head-wrap { position: relative; }
.v2-deps { position: absolute; right: -8px; top: 29px; transform: translateY(-50%); display: flex; z-index: 1; }
.v2-deps .card-v2__photo { position: relative; width: 24px; height: 24px; border: 1.5px solid #fff; box-sizing: content-box; }
.v2-deps .card-v2__photo-initials { font-size: 8px; }
.v2-deps .card-v2__photo + .card-v2__photo { margin-left: -7px; }
.v2-zam {
  position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
  height: 12px; padding: 0 4px; border-radius: 6px; border: 1px solid #fff; box-sizing: border-box;
  display: inline-flex; align-items: center; white-space: nowrap;
  background: #e2221c; color: #fff; font-family: var(--f-exp); font-weight: 600; font-size: 6px; line-height: 1;   /* праймари красный */
}
/* Два размера карточек: низкая — как внутренние в наборной (146 = 82 + плашка 64), высокая — 196.
   В ряду выравниваются по низу: узел .tree-node--bottom высотой 196, карточка прижата к низу,
   линия SVG дотягивается до верха карточки (ctCardTop / addConnector) */
.card-v2-multi--short .card-v2 { height: 82px; }
.card-v2-multi--short .card-v2-mh__body { padding: 0 14px 8px; }   /* как у внутренних карточек наборной */
.card-v2-multi--short .card-v2__role { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-v2-multi--tall.card-v2-multi--nodept .card-v2 { height: 196px; }
.tree-node--bottom { height: 196px; display: flex; flex-direction: column; justify-content: flex-end; }
/* Карточка без отдела (нет плашки снизу) — низ скруглён, как у карточек с отделом */
.card-v2-multi--nodept .card-v2-mh__body,
.card-v3__sub--nodept .card-v2-mh__body { border-radius: 0 0 20px 20px; box-shadow: 0 -2px 0 #fff; }   /* подкладка шва — только вверх, вниз не вылезать за карточку */
.card-v3__sub { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; width: 170px; min-height: 0; filter: drop-shadow(0 0 15px rgba(23,137,190,0.1)); }
/* В под-карточках убираем отрицательный margin и даём 5px сверху —
   Surface SVG в под-карточках делаем 50px (как wrap), body margin-top: 0, gap 4px */
.card-v3__sub .card-v2-mh__surface { height: 50px; }
.card-v3__sub .card-v2-mh__surface svg { height: 50px; }
/* body: Figma — top:0, sides:14, bottom:8; margin-top:0 т.к. surface теперь ровно 50px */
.card-v3__sub .card-v2-mh__body { margin-top: 0; padding: 0 14px 8px; }
/* Имя: не сжимается в под-карточке */
.card-v3__sub .card-v2__name { flex-shrink: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Роль: убираем фиксированную height:34px из базового правила, заполняет остаток */
.card-v3__sub .card-v2__role { height: auto; flex: 1; min-height: 1px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Badge NEW на блоке */
.block-tile--badge { position: relative; }
.block-tile__badge {
  position: absolute;
  top: 12px; right: 12px;
  background: var(--red);
  color: var(--white);
  font-family: var(--f-exp);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 3px 7px;
  border-radius: 20px;
}

/* ============================================================

============================================================ */
.pc-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.pc-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--surface);

  font-size: 22px; font-weight: 700; color: var(--gray);
}
.pc-avatar.has-photo { cursor: zoom-in; }
.pc-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pc-info { min-width: 0; }
.pc-name { font-family: var(--f-exp); font-weight: 700; font-size: 16px; color: var(--black); line-height: 1.3; margin-bottom: 5px; }
.pc-role { font-size: 13px; color: var(--gray); line-height: 1.4; }
.pc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.pc-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 14px; }
.pc-field:last-child { margin-bottom: 0; }
.pc-label { font-size: 11px; color: var(--gray); }
.pc-value { font-size: 14px; color: var(--black); font-weight: 500; line-height: 1.4; }
.pc-value-dash { font-size: 14px; color: rgba(0,0,0,0.28); }
.pc-value-link { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--black); font-weight: 500; }

/* Кнопка «Назад» в боковой панели */
.sp-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  padding: 0 0 18px;
  font-size: 13px;
  color: var(--gray);
  cursor: pointer;
  transition: color 0.15s;
}
.sp-back-btn:hover { color: var(--black); }

/* Дерево подразделения в карточке сотрудника */
.pc-section-label { font-family: var(--f-exp); font-weight: 600; font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; color: rgba(0,0,0,0.35); margin-bottom: 10px; }
.pc-org-tree  { display: flex; flex-direction: column; }
.pc-org-row   { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }

/* Список сотрудников в группе */
.emp-list { margin-top: 4px; }

  display: flex;

  justify-content: center;
  cursor: pointer;
}
.photo-overlay.vis { display: flex; }
.photo-overlay-img {
  max-width: 360px;

  height: auto;
  border-radius: 16px;

/* ============================================================

============================================================ */
.div-tooltip {
  position: fixed;
  background: rgba(0,0,0,0.88);

/* ============================================================

============================================================ */
.side-panel {

}

.le-desc-section { margin-bottom: 28px; }

.le-desc-text {

}
.btn-more-inline {

}
.btn-more-inline:hover { opacity: 0.75; }
.le-company { margin-bottom: 28px; }

/* Аккордеон юрлиц: компактная строка, раскрытие кликом по строке, контакты — плавно */
.le-acc-list { margin: 0 -12px; }
.le-acc + .le-acc { border-top: 1px solid #f0f0f0; }
.le-acc__row {
  width: 100%; min-height: 44px; padding: 10px 12px; gap: 12px;
  display: flex; align-items: center; justify-content: space-between;
  background: none; border: none; border-radius: 0; cursor: pointer; text-align: left;   /* ховер — во всю ширину между разделителями */
  font-family: var(--f-exp); font-size: 14px; line-height: 1.25; color: var(--black);
  transition: background 0.15s;
}
.le-acc__row:hover { background: #f6f6f6; }
.le-acc__row:focus-visible { outline: 3px solid rgba(60,131,246,0.3); }
.le-acc.open .le-acc__name { font-weight: 600; }
.le-acc__chev { display: grid; place-items: center; flex-shrink: 0; color: #7c7c7c; transition: transform 0.2s ease; }
.le-acc.open .le-acc__chev { transform: rotate(180deg); }
.le-acc__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.22s ease; }

.le-acc__inner { overflow: hidden; padding: 0 12px; }
.le-acc.open .le-acc__inner { padding-top: 6px; padding-bottom: 12px; }   /* воздух между строкой (её фоном/фокусом) и контактами */
.le-acc .vm-contact-row { min-height: 36px; padding: 0 12px; }
.le-acc .vm-contact-label { width: 150px; font-size: 12px; color: #7c7c7c; }
.le-acc .vm-contact-val { font-size: 13px; }
.le-company-name { font-family: var(--f-exp); font-weight: 700; font-size: 18px; margin-bottom: 12px; }
.le-company .vm-contacts { border-radius: 10px; }
.le-company .vm-contact-label { width: 160px; }
.le-desc-full h3 { font-family: var(--f-exp); font-weight: 700; font-size: 15px; margin: 20px 0 6px; color: var(--black); }
.le-desc-full p { font-size: 14px; color: #7c7c7c; line-height: 1.55; margin-bottom: 12px; }

/* ============================================================
   V2 MODAL PANEL
============================================================ */
.v2-modal-overlay { display: none; }

.v2-modal {
  position: fixed; top: 0; right: -520px; width: 500px; height: 100vh;
  background: #fff;
  box-shadow: -4px 0 32px rgba(82,42,34,0.10);
  border-radius: 12px 0 0 12px;
  display: flex; flex-direction: column; z-index: 201;
  transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
}
.v2-modal.open { right: 0; }

/* ---- Header ---- */
.vm-header { padding: 32px 32px 0; flex-shrink: 0; }
.vm-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.vm-title { font-family: var(--f-exp); font-weight: 600; font-size: 24px; color: var(--black); line-height: 1.25; flex: 1; }
.vm-close {
  background: none; border: none; cursor: pointer; padding: 2px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; width: 28px; height: 28px; margin-top: 2px;
  color: #282828; border-radius: 4px; transition: color 0.13s;
}
.vm-close:hover { color: #1A68E8; }
.vm-close:active { color: #0958D9; }
.vm-close:focus-visible { outline: 3px solid rgba(60,131,246,0.3); border-radius: 6px; }

/* ---- Breadcrumbs ---- */
.vm-breadcrumbs {
  display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  overflow: visible; margin-bottom: 20px; min-height: 20px;
}
.vm-crumb {
  font-family: var(--f-exp);
  font-size: 14px; font-weight: 400; line-height: 1.2;
  display: flex; align-items: center; gap: 8px;
  max-width: 230px; flex-shrink: 0;
}
.vm-crumb-text {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.vm-crumb-arrow { flex-shrink: 0; width: 12px; height: 12px; }
.vm-crumb.clickable { color: #41484a; cursor: pointer; }
.vm-crumb.clickable:hover { color: #3c83f6; }
.vm-crumb-ellipsis {
  font-family: var(--f-exp);
  font-size: 14px; color: #41484a; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px; position: relative;
}
.vm-crumb-ellipsis:hover { color: #3c83f6; }
.vm-crumb-ellipsis-btn { letter-spacing: 1px; }
.vm-crumb-ellipsis-drop {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.12); z-index: 300; min-width: 200px;
}
.vm-crumb-ellipsis-drop.open { display: block; }
.vm-crumb-drop-item {
  padding: 10px 16px; font-size: 13px; font-weight: 600; font-family: var(--f-exp);
  color: var(--black); cursor: pointer; border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.vm-crumb-drop-item:last-child { border-bottom: none; }
.vm-crumb-drop-item:hover { background: var(--surface); }

/* ---- Scrollable body (полоса — .scroll-xs) ---- */
.vm-content {
  flex: 1; overflow-y: auto; padding: 0 0 32px 0;
}
.vm-inner { display: flex; flex-direction: column; gap: 32px; padding: 0 28px; }

/* ---- Description ---- */
.vm-desc { display: flex; flex-direction: column; gap: 8px; }
.vm-desc-text {
  font-family: var(--f-exp); font-size: 14px; color: #888; line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.vm-desc-text.expanded { display: block; }
.vm-desc-more {
  display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-exp);
  font-size: 13px; color: var(--red); cursor: pointer; background: none; border: none; padding: 0;
}
.vm-desc-more-icon { width: 12px; height: 12px; transition: transform 0.2s; }
.vm-desc-more.open .vm-desc-more-icon { transform: rotate(180deg); }

/* ---- Section ---- */
.vm-section { display: flex; flex-direction: column; gap: 12px; }
.vm-section-title { font-family: var(--f-exp); font-weight: 600; font-size: 13px; color: #aaa; line-height: 1.2; letter-spacing: 0.03em; text-transform: uppercase; }

/* ---- Rows ---- */
.vm-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid #ebebeb; border-radius: 10px;
  cursor: pointer; transition: background 0.13s; text-decoration: none; color: inherit;
  box-sizing: border-box;
}
.vm-row:hover { background: #f7f7f7; }
.vm-row.no-click { cursor: default; }
.vm-row.no-click:hover { background: transparent; }

/* Avatar 36px */
.vm-ava {
  width: 36px; height: 36px; border-radius: 50%; background: #e9e9e9;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden; box-sizing: border-box;
}
.vm-ava img { width: 100%; height: 100%; object-fit: cover; }
.vm-ava-ini { font-family: var(--f-exp); font-weight: 600; font-size: 12px; color: #5A5A5A; }
.vm-ava-dept { background: #e1e1e1; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Row text */
.vm-row-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.vm-row-name { font-family: var(--f-exp); font-size: 14px; color: var(--black); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vm-row--dept .vm-row-name { font-size: 16px; font-weight: 400; }
.vm-row-role { font-family: var(--f-exp); font-size: 13px; color: #aaa; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Dept card manager info row */
.vm-dept-mgr { display: flex; gap: 8px; align-items: center; min-width: 0; }
.vm-dept-mgr-name { white-space: nowrap; flex-shrink: 0; font-family: var(--f-exp); font-size: 14px; color: #7c7c7c; line-height: 1.2; }
.vm-dept-mgr-sep { color: #c0c0c0; flex-shrink: 0; font-size: 10px; }
.vm-dept-mgr-role { font-family: var(--f-exp); font-size: 14px; color: #7c7c7c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; line-height: 1.2; }
.vm-row-also { font-family: var(--f-exp); font-size: 13px; color: #aaa; line-height: 1.2; }
.vm-row-also-link { color: #3c83f6; cursor: pointer; }
.vm-row-also-link:hover { text-decoration: underline; }
.vm-row-arrow { color: #d0d0d0; flex-shrink: 0; }

/* No manager placeholder */
.vm-no-manager {
  font-family: var(--f-exp); font-size: 14px; color: #aaa;
  padding: 12px 14px; border: 1px solid #ebebeb; border-radius: 10px;
}

/* ---- Hero (person modal) ---- */
.vm-hero { display: flex; align-items: center; gap: 20px; padding: 4px 0 8px; }
.vm-hero-ava {
  width: 96px; height: 96px; border-radius: 50%; background: #e9e9e9;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
}
.vm-hero-ava img { width: 100%; height: 100%; object-fit: cover; }
.vm-hero-ini { font-family: var(--f-exp); font-weight: 600; font-size: 36px; color: #5A5A5A; }
.vm-hero-info { flex: 1; min-width: 0; }
.vm-hero-name { font-family: var(--f-exp); font-weight: 600; font-size: 26px; color: var(--black); line-height: 1.2; margin-bottom: 6px; }
.vm-hero-role { font-family: var(--f-exp); font-size: 14px; color: #888; line-height: 1.3; }

/* ---- Contacts ---- */
.vm-contacts { border: 1px solid #ebebeb; border-radius: 10px; overflow: hidden; }
.vm-contact-row { display: flex; align-items: center; min-height: 48px; padding: 0 14px; gap: 12px; }
.vm-contact-row + .vm-contact-row { border-top: 1px solid #ebebeb; }
.vm-contact-label { display: flex; align-items: center; gap: 8px; width: 120px; flex-shrink: 0; font-family: var(--f-exp); font-size: 13px; color: #aaa; }
.vm-contact-val { font-family: var(--f-exp); font-size: 14px; color: var(--black); flex: 1; }
/* icon-btn-primary: Default=#282828 Hover=#1A68E8 Active=#0958D9 */
.vm-contact-copy {
  background: none; border: none; cursor: pointer; padding: 2px;
  display: flex; align-items: center; justify-content: center;
  color: #3C83F6; border-radius: 4px; transition: color 0.13s;
  flex-shrink: 0;
}
.vm-contact-copy:hover { color: #1A68E8; }
.vm-contact-copy:active { color: #0958D9; }
.vm-contact-copy:focus-visible { outline: 3px solid rgba(60,131,246,0.3); border-radius: 6px; }
.vm-contact-empty { font-family: var(--f-exp); font-size: 13px; color: #ccc; }

/* ---- Wizard (место в структуре) ---- */
.vm-wizard { border: 1px solid #e1e1e1; border-radius: 6px; padding: 16px 12px; }
.vm-wz-step { display: flex; gap: 4px; align-items: flex-start; }
.vm-wz-track { display: flex; flex-direction: column; align-items: center; align-self: stretch; flex-shrink: 0; padding-top: 11px; box-sizing: border-box; }
.vm-wz-dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #d0d0d0; background: #fff; box-sizing: border-box; flex-shrink: 0; }
.vm-wz-dot.active { border: 2.5px solid var(--red); background: #fff; }
.vm-wz-line { width: 2px; flex: 1; min-height: 8px; margin-top: 4px; background: #d8d8d8; flex-shrink: 0; }
.vm-wz-text { flex: 1; padding: 10px 12px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-radius: 12px; }
.vm-wz-step:last-child .vm-wz-text { background: #f6f6f6; min-height: 60px; box-sizing: border-box; }
.vm-wz-label { font-family: var(--f-exp); font-size: 14px; color: #3c83f6; cursor: pointer; line-height: 1.2; }
.vm-wz-label:hover { text-decoration: underline; }
.vm-wz-label.wz-current { color: var(--black); cursor: default; }
.vm-wz-label.wz-current:hover { text-decoration: none; }
.vm-wz-role { font-family: var(--f-exp); font-size: 14px; color: #7e7e7e; line-height: 1.2; }
.vm-wz-sub  { font-family: var(--f-exp); font-size: 14px; color: #7e7e7e; line-height: 1.2; }

    if (!o || typeof o !== 'object') return;

      const [sur, first, mid] = (t.fullName || '').split(' ');

  });

let _skipHashChange = false;

function goTo(view, companyId, blockId, blockName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  state = { view, companyId, blockId, blockName };
  renderBreadcrumb();
  window.scrollTo(0, 0);

  _skipHashChange = true;
  if (view === 'landing') {
    window.location.hash = 'landing';
  } else if (view === 'tree') {
    window.location.hash = 'tree/' + companyId + '/' + blockId + '/' + encodeURIComponent(blockName || '');
  }
}

function restoreFromHash() {
  const hash = window.location.hash.slice(1);
  if (!hash || hash === 'landing') { renderLanding(); return; }
  const [view, companyId, blockId, blockNameEnc] = hash.split('/');
  // Название берём из списка блоков компании, а не из адреса — в ссылке может быть что угодно
  const reg = ((ORG_DATA[companyId] || {}).blocks || []).find(b => b.id === blockId);
  const blockName = reg ? reg.name.replace(/\s*\n\s*/g, ' ') : (blockNameEnc ? decodeURIComponent(blockNameEnc) : '');
  if (view === 'tree' && companyId && blockId) {
    renderLanding();
    openTree(companyId, blockId, blockName);
  } else {
    renderLanding();
  }
}

window.addEventListener('hashchange', () => {
  if (_skipHashChange) { _skipHashChange = false; return; }
  restoreFromHash();
});

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  if (state.view === 'landing') { el.innerHTML = ''; return; }
  const crumbs = [{ label: 'Главная', fn: () => goTo('landing') }];
  if (state.blockName) crumbs.push({ label: state.blockName, fn: null });
  el.innerHTML = '';
  crumbs.forEach((c, i) => {
    if (i > 0) { const sep = document.createElement('span'); sep.className = 'bc-sep'; sep.textContent = '›'; el.appendChild(sep); }
    const span = document.createElement('span');
    span.className = 'bc-item' + (i === crumbs.length - 1 ? ' current' : '');
    span.textContent = c.label;
    if (c.fn && i < crumbs.length - 1) span.onclick = c.fn;
    el.appendChild(span);
  });
}

function collectV2Persons(treeData) {
  const result = [];
  const seen = new Set();
  function add(p) {
    if (!p || !p.id || !p.fullName || seen.has(p.id)) return;
    seen.add(p.id);
    result.push({ personId: p.id, fullName: p.fullName, name: p.name,
      role: (p.role || '').replace(/\n/g, ' '), photo: p.photo || null });
  }
  function walkModal(modal) {
    if (!modal) return;
    (modal.managers  || []).forEach(add);
    (modal.deputies  || []).forEach(add);
    (modal.assistants|| []).forEach(add);
    (modal.team      || []).forEach(add);
    (modal.subdepts  || []).forEach(sd => sd.modal && walkModal(sd.modal));
  }
  function walkPerson(p) {
    if (!p) return;
    add(p);
    if (p.dept && p.dept.modal) walkModal(p.dept.modal);
    (p.nested   || []).forEach(n => {
      walkPerson(n);
      (n.children || []).forEach(walkPerson);
      if (n.childBlock) {
        add(n.childBlock.head);
        (n.childBlock.depts || []).forEach(d => { add(d.person); (d.children || []).forEach(walkPerson); });
      }
    });
    (p.children || []).forEach(walkPerson);
    if (p.childBlock) {
      add(p.childBlock.head);
      (p.childBlock.depts || []).forEach(d => { add(d.person); (d.children || []).forEach(walkPerson); });
    }
  }
  (treeData.heads         || []).forEach(walkPerson);
  (treeData.blockDeputies || []).forEach(walkPerson);
  (treeData.headsDepts    || []).forEach(d => d.person && add(d.person));
  (treeData.persons       || []).forEach(walkPerson);
  return result;
}

function buildGlobalSearchIndex() {
  GLOBAL_SEARCH_INDEX = [];
  const treeCompanies = [
    { id: 'setlgroup', name: 'Setl Group' },
    { id: 'setltech',  name: 'Setl Tech'  },
  ];
  treeCompanies.forEach(co => {
    const coData = ORG_DATA[co.id];
    if (!coData) return;
    (coData.blocks || []).forEach(block => {
      const treeData = ORG_DATA.trees?.[block.id];
      if (!treeData || treeData.version !== 2) return;
      const blockName = block.name.replace(/\n/g, ' ');

      // Persons
      collectV2Persons(treeData).forEach(p => {
        GLOBAL_SEARCH_INDEX.push({
          type: 'tree', personId: p.personId, fullName: p.fullName, name: p.name,
          role: p.role, photo: p.photo, companyId: co.id, companyName: co.name,
          blockId: block.id, blockName,
        });
      });

      // Build registries to read dept data
      buildV2Registries(treeData);

      // Block entry
      const headNames = (treeData.heads || [])
        .map(h => h.fullName || h.name || '').filter(Boolean).join(', ');
      GLOBAL_SEARCH_INDEX.push({
        type: 'block', blockId: block.id, blockName, name: blockName,
        managerName: headNames, companyId: co.id, companyName: co.name,
      });

      // Dept entries from V2_DEPT_REG (populated by buildV2Registries)
      Object.entries(V2_DEPT_REG).forEach(([deptId, dept]) => {
        if (!dept.name) return;
        const mgr = (dept.managers || [])[0];
        const managerName = mgr ? (mgr.fullName || mgr.name || '') : '';
        GLOBAL_SEARCH_INDEX.push({
          type: 'dept', deptId, name: dept.name.replace(/\n/g, ' '), managerName,
          companyId: co.id, companyName: co.name, blockId: block.id, blockName,
        });
      });
    });
  });
  PN_PERSONS.forEach(p => {
    GLOBAL_SEARCH_INDEX.push({
      type: 'pn', personId: p.id, fullName: p.fullName, name: p.name,
      role: p.role, photo: p.photo,
      companyId: 'pn', companyName: 'Петербургская Недвижимость',
      phone: p.phone, email: p.email, office: p.office,
    });
  });
}

// Поле поиска (.search-wrap): с введённым текстом лупа меняется на крестик сброса.
// Сброс шлёт обычное событие input — обработчики поля срабатывают как при стирании вручную
function setupSearchClear(wrap) {
  if (!wrap || wrap.dataset.clearReady) return;
  wrap.dataset.clearReady = '1';
  const input = wrap.querySelector('.search-input');
  const btn = wrap.querySelector('.search-clear');
  const sync = () => wrap.classList.toggle('has-value', !!input.value);
  input.addEventListener('input', sync);
  btn.addEventListener('mousedown', e => e.preventDefault());   // не отнимать фокус у поля
  btn.addEventListener('click', () => {
    input.value = '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.focus();
  });
  sync();
}
document.querySelectorAll('.search-wrap').forEach(setupSearchClear);

// Очистить поле кодом (после выбора результата) — вместе с крестиком, без повторного поиска
function resetSearchInput(input) {
  if (!input) return;
  input.value = '';
  const wrap = input.closest('.search-wrap');
  if (wrap) wrap.classList.remove('has-value');
}

function normalizeYo(s) { return s.replace(/ё/g, 'е'); }
function wordMatch(text, q) {
  if (!text) return false;
  const nq = normalizeYo(q);
  return normalizeYo(text.toLowerCase()).split(/[\s\n/()]+/).some(w => w.startsWith(nq));
}

function onLandingSearch(val) {
  const dd = document.getElementById('search-dd-landing');
  if (!val.trim()) { dd.classList.remove('open'); dd.innerHTML = ''; return; }
  const q = val.toLowerCase();
  const hits = GLOBAL_SEARCH_INDEX.filter(e => {
    if (e.type === 'dept' || e.type === 'block')
      return wordMatch(e.name, q) || wordMatch(e.managerName, q);
    return wordMatch(e.fullName, q) || wordMatch(e.name, q) || wordMatch(e.role, q);
  });
  if (!hits.length) { dd.classList.remove('open'); dd.innerHTML = ''; return; }

  const order = ['setlgroup', 'pn', 'setltech'];
  const groups = {};
  hits.forEach(h => { if (!groups[h.companyId]) groups[h.companyId] = []; groups[h.companyId].push(h); });

  // Строим _globalSearchHits в том же порядке, что и рендер (по группам)
  _globalSearchHits = [];
  order.forEach(coId => { (groups[coId] || []).forEach(e => _globalSearchHits.push(e)); });

  let itemIdx = 0;
  let html = '<div class="gs-dd-inner">';
  order.forEach(coId => {
    const items = groups[coId];
    if (!items || !items.length) return;
    const coName = items[0].companyName;
    html += `<div class="gs-group-head">${escHtml(coName)} — ${items.length}</div>`;
    items.forEach(e => {
      let avaHtml;
      if (e.type === 'dept' || e.type === 'block') {
        avaHtml = `<div class="gs-ava gs-ava-dept">${SVG_DEPT}</div>`;
      } else if (e.photo) {
        avaHtml = `<img class="gs-ava-img" src="${e.photo}" alt="">`;
      } else {
        const avaColor = avatarColor(e.fullName || e.name);
        const ini = (e.fullName || e.name || '').split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
        avaHtml = `<div class="gs-ava" style="background:${avaColor}">${ini}</div>`;
      }
      let subHtml;
      if (e.type === 'dept') {
        subHtml = (e.managerName ? escHtml(e.managerName) + `<span class="gs-dot">·</span>` : '')
          + escHtml(e.blockName || '');
      } else if (e.type === 'block') {
        subHtml = escHtml(e.managerName || '');
      } else {
        const blockPart = (e.type === 'tree' && e.blockName)
          ? `<span class="gs-dot">·</span>${escHtml(e.blockName)}` : '';
        subHtml = escHtml(e.role || '') + blockPart;
      }
      html += `<div class="gs-item" onmousedown="selectGlobalResult(${itemIdx})">`
        + `<div class="gs-ava-wrap">${avaHtml}</div>`
        + `<div class="gs-info"><div class="gs-name">${escHtml(e.fullName || e.name)}</div>`
        + `<div class="gs-sub">${subHtml}</div></div></div>`;
      itemIdx++;
    });
  });
  html += '</div>';

  dd.innerHTML = html;
  dd.classList.add('open');
}
